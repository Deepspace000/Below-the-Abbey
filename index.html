<script>
'use strict';
/* ==========================================================================
   BELOW THE ABBEY  -  a small grid-based first-person dungeon crawler
   Design space 480x320 (canvas is 2x).  3D viewport is 420x210 design units.
   ========================================================================== */
const VERSION='0.12';
const FUI="'IM Fell English SC',Georgia,serif", FTXT="'IM Fell English',Georgia,serif", FTITLE="'UnifrakturCook','IM Fell English SC',Georgia,serif";
const DW=480, DH=320;
const cv=document.getElementById('c'), ctx=cv.getContext('2d');
ctx.imageSmoothingEnabled=true; ctx.imageSmoothingQuality='high';

/* ---------- small utils ---------- */
const TAU=Math.PI*2;
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const rnd=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
function hash2(x,y,s){let h=Math.imul(x|0,374761393)+Math.imul(y|0,668265263)+Math.imul(s|0,1274126177);h=Math.imul(h^(h>>>13),1274126177);return((h^(h>>>16))>>>0)/4294967296}
function vnoise(x,y,p,s){
  const xi=Math.floor(x),yi=Math.floor(y),xf=x-xi,yf=y-yi,u=xf*xf*(3-2*xf),v=yf*yf*(3-2*yf);
  const m=(a,b)=>hash2(((a%p)+p)%p,((b%p)+p)%p,s);
  return(m(xi,yi)*(1-u)+m(xi+1,yi)*u)*(1-v)+(m(xi,yi+1)*(1-u)+m(xi+1,yi+1)*u)*v;
}
function fbm(x,y,s){let t=0,a=.5,f=4,n=0;for(let o=0;o<4;o++){t+=a*vnoise(x*f,y*f,f,s+o*17);n+=a;a*=.5;f*=2}return t/n}
const smooth=(a,b,x)=>{const t=clamp((x-a)/(b-a),0,1);return t*t*(3-2*t)};

/* ==========================================================================
   TEXTURES (procedural, painted-stone look)
   ========================================================================== */
const TS=128;
function stoneTex(seed,o){
  const d=new Uint8ClampedArray(TS*TS*4), rh=TS/o.rows;
  for(let y=0;y<TS;y++)for(let x=0;x<TS;x++){
    const r=Math.floor(y/rh), n=o.cols(r), bw=TS/n;
    const off=o.stag===1?(r%2)*bw/2:(o.stag===2?hash2(r,5,seed)*bw:0);
    const xx=(x+off)%TS, c=Math.floor(xx/bw), bx=xx-c*bw, by=y-r*rh;
    const id=hash2(c,r,seed+11);
    const dl=bx,dr=bw-1-bx,dt=by,db=rh-1-by;
    const mm=Math.min(dl,dr,dt,db)+(hash2(x>>2,y>>2,seed)-.5)*1.6;
    const nn=fbm(x/TS,y/TS,seed);
    let R,G,B;
    if(mm<o.mortar){
      const k=.7+.6*nn; R=o.mort[0]*k;G=o.mort[1]*k;B=o.mort[2]*k;
    }else{
      const A=o.a,Bc=o.b;
      R=A[0]+(Bc[0]-A[0])*id;G=A[1]+(Bc[1]-A[1])*id;B=A[2]+(Bc[2]-A[2])*id;
      let L=.72+nn*.7+(hash2(x,y,seed+3)-.5)*.16+(id-.5)*.2;
      const tl=Math.min(dl,dt)-o.mortar, br=Math.min(dr,db)-o.mortar;
      if(tl<4)L+=.3*(1-tl/4);
      if(br<5)L-=.4*(1-br/5);
      R*=L;G*=L;B*=L;
    }
    if(o.moss){
      const val=fbm(x/TS,y/TS,seed+77)+(y/TS-.5)*.35;
      const thr=.74-o.moss;
      if(val>thr){const a=Math.min(1,(val-thr)*7)*.85, k=.6+nn*.7;
        R=R*(1-a)+58*k*a;G=G*(1-a)+90*k*a;B=B*(1-a)+36*k*a;}
    }
    if(!o.flat){ // soot at top, damp grime at the bottom
      const yy=y/TS; let k=1; if(yy>.78)k=1-(yy-.78)*1.3; if(yy<.12)k*=.8+yy*1.6;
      R*=k;G*=k;B*=k;
    }
    const i=(y*TS+x)*4; d[i]=R;d[i+1]=G;d[i+2]=B;d[i+3]=255;
  }
  // cracks
  for(let k=0;k<(o.cracks||0);k++){
    let px=hash2(k,1,seed)*TS, py=hash2(k,2,seed)*TS*.8, ang=1.2+hash2(k,3,seed)*.8;
    for(let s=0;s<34;s++){
      ang+=(hash2(k,s+9,seed)-.5)*.9; px+=Math.cos(ang)*1.7; py+=Math.sin(ang)*1.7;
      for(let ox=-1;ox<=1;ox++){
        const xi=(((px+ox)|0)%TS+TS)%TS, yi=clamp(py|0,0,TS-1), i=(yi*TS+xi)*4;
        const f=ox===0?.45:.75; d[i]*=f;d[i+1]*=f;d[i+2]*=f;
      }
    }
  }
  return d;
}
function toCanvas(d){const c=document.createElement('canvas');c.width=c.height=TS;c.getContext('2d').putImageData(new ImageData(new Uint8ClampedArray(d),TS,TS),0,0);return c}
function pix(c){return c.getContext('2d').getImageData(0,0,TS,TS).data}
function rrect(x,X,Y,W,H,r){x.beginPath();x.moveTo(X+r,Y);x.arcTo(X+W,Y,X+W,Y+H,r);x.arcTo(X+W,Y+H,X,Y+H,r);x.arcTo(X,Y+H,X,Y,r);x.arcTo(X,Y,X+W,Y,r);x.closePath()}

const stoneOpts={rows:3,cols:r=>[2,3,2][r%3],stag:2,mortar:3,a:[124,118,108],b:[92,88,82],mort:[28,26,24],moss:.1,cracks:3};
const brickOpts={rows:8,cols:()=>4,stag:1,mortar:2,a:[142,66,48],b:[100,42,36],mort:[36,24,22],moss:0,cracks:4};
const TEX=[]; // {d,e}
function addTex(d,e){TEX.push({d,e:e||null});return TEX.length-1}

function archPath(x,w,top,bottom){
  x.beginPath();x.moveTo(w[0],bottom);x.lineTo(w[0],top+w[2]);x.arc((w[0]+w[1])/2,top+w[2],w[2],Math.PI,0);x.lineTo(w[1],bottom);x.closePath();
}
function doorTex(baseD,locked){
  const c=toCanvas(baseD),x=c.getContext('2d');
  const L=20,R=108,top=30,rad=44;
  // frame shadow
  x.save();x.lineWidth=6;x.strokeStyle='#15110d';archPath(x,[L-2,R+2,rad+2],top-2,128);x.stroke();x.restore();
  x.save();archPath(x,[L,R,rad],top,128);x.clip();
  // planks
  const n=5,pw=(R-L)/n;
  for(let i=0;i<n;i++){
    const g=x.createLinearGradient(L+i*pw,0,L+(i+1)*pw,0);
    const k=locked?.75:1, v=hash2(i,4,9);
    g.addColorStop(0,`rgb(${(70+v*18)*k|0},${(44+v*10)*k|0},${(24+v*6)*k|0})`);
    g.addColorStop(.5,`rgb(${(104+v*20)*k|0},${(68+v*12)*k|0},${(36+v*8)*k|0})`);
    g.addColorStop(1,`rgb(${(60+v*14)*k|0},${(38+v*8)*k|0},${(20+v*5)*k|0})`);
    x.fillStyle=g;x.fillRect(L+i*pw,0,pw+1,128);
    x.fillStyle='rgba(0,0,0,.55)';x.fillRect(L+i*pw,0,1.5,128);
  }
  for(let i=0;i<140;i++){ // grain
    const gx=L+hash2(i,1,3)*(R-L),gy=hash2(i,2,3)*128,gl=6+hash2(i,3,3)*18;
    x.strokeStyle=`rgba(${hash2(i,4,3)>.5?'30,16,6':'150,100,60'},${.12+hash2(i,5,3)*.18})`;x.lineWidth=1;
    x.beginPath();x.moveTo(gx,gy);x.lineTo(gx+(hash2(i,6,3)-.5)*2,gy+gl);x.stroke();
  }
  // iron bands
  const bands=locked?[56,92]:[60,98];
  for(const by of bands){
    const g=x.createLinearGradient(0,by,0,by+10);g.addColorStop(0,'#3a3836');g.addColorStop(.4,'#26241f');g.addColorStop(1,'#12100e');
    x.fillStyle=g;x.fillRect(L,by,R-L,10);
    x.fillStyle='rgba(255,255,255,.14)';x.fillRect(L,by,R-L,1.5);
    for(let rx=L+8;rx<R;rx+=17){x.fillStyle='#55524d';x.beginPath();x.arc(rx,by+5,2.2,0,TAU);x.fill();x.fillStyle='rgba(0,0,0,.5)';x.beginPath();x.arc(rx+.7,by+5.7,1.2,0,TAU);x.fill();}
  }
  if(locked){
    // heavy padlock plate
    x.fillStyle='#1a1816';rrect(x,50,66,28,30,4);x.fill();
    x.strokeStyle='#5a5650';x.lineWidth=2;rrect(x,50,66,28,30,4);x.stroke();
    x.fillStyle='#8a6a22';rrect(x,54,76,20,16,3);x.fill();
    x.strokeStyle='#b8902f';x.lineWidth=3;x.beginPath();x.arc(64,76,7,Math.PI,0);x.stroke();
    x.fillStyle='#120e08';x.beginPath();x.arc(64,83,2.6,0,TAU);x.fill();x.fillRect(63,83,2,6);
  }else{
    x.strokeStyle='#1d1b19';x.lineWidth=3.5;x.beginPath();x.arc(88,82,6.5,0,TAU);x.stroke();
    x.strokeStyle='#6a665f';x.lineWidth=1.2;x.beginPath();x.arc(88,82,6.5,Math.PI*1.1,Math.PI*1.7);x.stroke();
    x.fillStyle='#262421';x.beginPath();x.arc(88,75,3.5,0,TAU);x.fill();
  }
  // inner shadow
  const sg=x.createLinearGradient(L,0,R,0);sg.addColorStop(0,'rgba(0,0,0,.5)');sg.addColorStop(.12,'rgba(0,0,0,0)');sg.addColorStop(.88,'rgba(0,0,0,0)');sg.addColorStop(1,'rgba(0,0,0,.5)');
  x.fillStyle=sg;x.fillRect(L,0,R-L,128);
  x.restore();
  return pix(c);
}
function exitTex(baseD){
  const c=toCanvas(baseD),x=c.getContext('2d'),e=document.createElement('canvas');e.width=e.height=TS;const ex=e.getContext('2d');
  const L=22,R=106,top=26,rad=42;
  x.save();x.lineWidth=7;x.strokeStyle='#15110d';archPath(x,[L-2,R+2,rad+2],top-2,128);x.stroke();x.restore();
  for(const q of [x,ex]){
    q.save();archPath(q,[L,R,rad],top,128);q.clip();
    const g=q.createLinearGradient(0,top-rad,0,128);
    g.addColorStop(0,'#9fc4f0');g.addColorStop(.55,'#e8f1ff');g.addColorStop(1,'#fff6d8');
    q.fillStyle=g;q.fillRect(0,0,128,128);
    // stairs
    for(let i=0;i<7;i++){
      const y=128-i*9-8;
      q.fillStyle=i%2?'rgba(160,150,130,.95)':'rgba(190,180,160,.95)';q.fillRect(L+i*2,y,R-L-i*4,9);
      q.fillStyle='rgba(70,64,56,.9)';q.fillRect(L+i*2,y,R-L-i*4,1.5);
    }
    q.restore();
  }
  return {d:pix(c),e:pix(e)};
}
function torchFrames(baseD){
  const out=[];
  for(let f=0;f<4;f++){
    const c=toCanvas(baseD),x=c.getContext('2d');
    x.strokeStyle='#161514';x.lineWidth=5;x.lineCap='round';
    x.beginPath();x.moveTo(64,108);x.lineTo(64,96);x.moveTo(50,90);x.quadraticCurveTo(64,108,78,90);x.stroke();
    const g=x.createLinearGradient(57,0,71,0);g.addColorStop(0,'#33200f');g.addColorStop(.5,'#6d4624');g.addColorStop(1,'#25160a');
    x.fillStyle=g;x.beginPath();x.moveTo(60,100);x.lineTo(68,100);x.lineTo(71,66);x.lineTo(57,66);x.closePath();x.fill();
    x.fillStyle='#14100c';x.beginPath();x.ellipse(64,62,10,8,0,0,TAU);x.fill();
    x.fillStyle='#2a1e12';x.fillRect(55,60,18,3);
    const e=document.createElement('canvas');e.width=e.height=TS;const ex=e.getContext('2d');
    const rg=ex.createRadialGradient(64,50,2,64,50,34);rg.addColorStop(0,'rgba(255,170,60,.55)');rg.addColorStop(1,'rgba(255,120,30,0)');
    ex.fillStyle=rg;ex.fillRect(0,0,128,128);
    const w=Math.sin(f*1.9)*3, h=[26,31,24,29][f];
    ex.beginPath();ex.moveTo(54,62);ex.bezierCurveTo(48,50,60+w,42,64+w,64-h-14);ex.bezierCurveTo(70+w,42,80,50,74,62);ex.closePath();
    const fg=ex.createRadialGradient(64,58,1,64,52,26);fg.addColorStop(0,'#fffbd0');fg.addColorStop(.35,'#ffc443');fg.addColorStop(.7,'#e8641a');fg.addColorStop(1,'rgba(160,32,8,.0)');
    ex.fillStyle=fg;ex.fill();
    out.push({d:pix(c),e:pix(e)});
  }
  return out;
}
function dirtTex(seed){
  const d=new Uint8ClampedArray(TS*TS*4);
  for(let y=0;y<TS;y++)for(let x=0;x<TS;x++){
    const u=x/TS,v=y/TS;
    const n1=fbm(u,v,seed),n2=fbm(u*2%1,v*2%1,seed+31),mud=fbm(u,v,seed+90);
    let k=.62+n1*.75+(n2-.5)*.35+(hash2(x,y,seed+5)-.5)*.32;
    let R=104*k,G=80*k,B=54*k;
    if(mud>.56){const a=Math.min(1,(mud-.56)*6)*.7;R=R*(1-a)+52*a*k;G=G*(1-a)+38*a*k;B=B*(1-a)+26*a*k} // damp dark patches
    if(n2>.62){const a=Math.min(1,(n2-.62)*6)*.35;R+=24*a;G+=18*a;B+=8*a} // dry dusty patches
    const i=(y*TS+x)*4;d[i]=R;d[i+1]=G;d[i+2]=B;d[i+3]=255;
  }
  const dot=(cx,cy,r,f,hi)=>{ // pebble with a lit top-left and shadowed bottom-right
    for(let dy=-r-1;dy<=r+1;dy++)for(let dx=-r-1;dx<=r+1;dx++){
      const dd=Math.hypot(dx,dy);if(dd>r)continue;
      const xi=((cx+dx)%TS+TS)%TS,yi=((cy+dy)%TS+TS)%TS,i=(yi*TS+xi)*4;
      const lit=1+(-(dx+dy)/(r*2))*.5*hi, e=dd>r-1?.7:1, m=f*lit*e;
      d[i]=d[i]*.3+110*m*.7;d[i+1]=d[i+1]*.3+98*m*.7;d[i+2]=d[i+2]*.3+84*m*.7;
    }
  };
  for(let j=0;j<190;j++){dot((hash2(j,1,seed)*TS)|0,(hash2(j,2,seed)*TS)|0,1+((hash2(j,3,seed)*2)|0),.7+hash2(j,4,seed)*.7,1)}
  for(let j=0;j<6;j++){dot((hash2(j,7,seed)*TS)|0,(hash2(j,8,seed)*TS)|0,4+((hash2(j,9,seed)*3)|0),.8+hash2(j,10,seed)*.3,1)} // larger stones
  // scuffs / cart-rut streaks
  for(let j=0;j<9;j++){
    let px=hash2(j,11,seed)*TS,py=hash2(j,12,seed)*TS,a=hash2(j,13,seed)*6.28;
    for(let t=0;t<22;t++){a+=(hash2(j,t+20,seed)-.5)*.5;px+=Math.cos(a)*1.6;py+=Math.sin(a)*1.6;
      const xi=((px|0)%TS+TS)%TS,yi=((py|0)%TS+TS)%TS,i=(yi*TS+xi)*4;d[i]*=.78;d[i+1]*=.78;d[i+2]*=.78}
  }
  return d;
}
/* texture index map */
let T_STONE,T_BRICK,T_DOOR,T_LOCK,T_EXIT,T_TORCH_STONE,T_TORCH_BRICK,FLOORD,CEILD;
function buildTextures(){
  const stone=stoneTex(7,stoneOpts), brick=stoneTex(23,brickOpts);
  T_STONE=addTex(stone);T_BRICK=addTex(brick);
  T_DOOR=addTex(doorTex(stone,false));T_LOCK=addTex(doorTex(stone,true));
  const ex=exitTex(stone);T_EXIT=addTex(ex.d,ex.e);
  T_TORCH_STONE=TEX.length;for(const f of torchFrames(stone))addTex(f.d,f.e);
  T_TORCH_BRICK=TEX.length;for(const f of torchFrames(brick))addTex(f.d,f.e);
  FLOORD=dirtTex(41);
  CEILD=stoneTex(57,{rows:2,cols:()=>2,stag:1,mortar:3,a:[78,76,82],b:[58,56,62],mort:[16,15,17],moss:0,cracks:2,flat:true});
}

const IMG={};
function loadImg(name,src){return new Promise(res=>{const i=new Image();i.onload=()=>{IMG[name]=i;res()};i.onerror=()=>res();i.src=src+'?v='+VERSION})}
function mkCanvas(w,h,fn){const c=document.createElement('canvas');c.width=w;c.height=h;fn(c.getContext('2d'),w,h);return c}
function fallbackRat(big){
  return mkCanvas(220,150,(x,w,h)=>{
    x.fillStyle=big?'#4a3a2e':'#25201d';x.beginPath();x.ellipse(110,95,78,40,0,0,TAU);x.fill();
    x.beginPath();x.ellipse(52,84,34,26,0,0,TAU);x.fill();
    x.fillStyle='#e8c030';x.beginPath();x.arc(44,78,4,0,TAU);x.arc(62,76,4,0,TAU);x.fill();
    x.strokeStyle='#c98a8a';x.lineWidth=5;x.beginPath();x.moveTo(184,100);x.quadraticCurveTo(215,90,205,50);x.stroke();
  });
}
function makeProps(){
  IMG.potion=mkCanvas(64,80,(x)=>{

/* ==========================================================================
   AUDIO (tiny synth)
   ========================================================================== */
let AC=null,MASTER=null,NB=null;
function audioInit(){
  if(AC)return;
  try{
    AC=new (window.AudioContext||window.webkitAudioContext)();MASTER=AC.createGain();MASTER.gain.value=.55;MASTER.connect(AC.destination);
    const len=AC.sampleRate;NB=AC.createBuffer(1,len,AC.sampleRate);const d=NB.getChannelData(0);for(let i=0;i<len;i++)d[i]=Math.random()*2-1;
    drone();
  }catch(e){AC=null}
}
function drone(){
  const g=AC.createGain();g.gain.value=0;g.connect(MASTER);
  g.gain.linearRampToValueAtTime(.05,AC.currentTime+6);
  for(const [f,dt] of [[55,0],[82.6,4],[110.4,-5],[164.9,3]]){
    const o=AC.createOscillator();o.type='sine';o.frequency.value=f;o.detune.value=dt;
    const og=AC.createGain();og.gain.value=f>100?.35:1;
    const l=AC.createOscillator();l.frequency.value=.05+Math.random()*.08;const lg=AC.createGain();lg.gain.value=.4;l.connect(lg);lg.connect(og.gain);
    o.connect(og);og.connect(g);o.start();l.start();
  }
}
function tone(f0,f1,dur,type,vol,delay){
  if(!AC||G.mute)return;const t=AC.currentTime+(delay||0),o=AC.createOscillator(),g=AC.createGain();
  o.type=type||'sine';o.frequency.setValueAtTime(f0,t);if(f1&&f1!==f0)o.frequency.exponentialRampToValueAtTime(f1,t+dur);
  g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol,t+Math.min(.015,dur/3));g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  o.connect(g);g.connect(MASTER);o.start(t);o.stop(t+dur+.05);
}
function nz(dur,vol,type,f0,f1,delay){
  if(!AC||G.mute)return;const t=AC.currentTime+(delay||0),s=AC.createBufferSource(),f=AC.createBiquadFilter(),g=AC.createGain();
  s.buffer=NB;s.loop=true;f.type=type;f.frequency.setValueAtTime(f0,t);if(f1)f.frequency.exponentialRampToValueAtTime(f1,t+dur);f.Q.value=1.2;
  g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol,t+.01);g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  s.connect(f);f.connect(g);g.connect(MASTER);s.start(t);s.stop(t+dur+.05);
}
function sfx(n){
  if(!AC||G.mute)return;
  switch(n){
    case 'step':nz(.1,.22,'lowpass',380,120);tone(70,45,.1,'sine',.18);break;
    case 'turn':nz(.14,.1,'lowpass',500,200);break;

function bfs(e){

  const q=[[e.x,e.y]];dist[e.y*MW+e.x]=0;
  const occupied=new Set(G.enemies.filter(o=>o!==e&&o.hp>0).map(o=>o.y*MW+o.x));
  while(q.length){
    const [x,y]=q.shift(),dd=dist[y*MW+x];
    if(x===G.P.x&&y===G.P.y)return {dist:dd,step:first[y*MW+x]};
    if(dd>14)continue;
    for(let k=0;k<4;k++){
      const nx=x+DIRS[k][0],ny=y+DIRS[k][1],ni=ny*MW+nx;

      dist[ni]=dd+1;first[ni]=dd===0?ny*MW+nx:first[y*MW+x];q.push([nx,ny]);
    }
  }

}

function bagAdd(it){

const countPotions=()=>G.bag.reduce((a,b)=>a+(b.id==='potion'?b.n:0),0);
function slotFits(slot,d,hi){
  switch(slot){
    case 'head':return d.k==='head';case 'chest':return d.k==='chest';case 'arms':return d.k==='arms';case 'legs':return d.k==='legs';
    case 'main':return d.k==='weapon'||d.k==='light';
    case 'off':return d.k==='weapon'||d.k==='shield'||d.k==='light';
    case 'alt':return d.k==='weapon';
  }
  if(slot[0]==='r')return d.k==='ring';
  if(slot[0]==='s')return d.k==='spell'&&HERO_DEF[hi].caster;
  return false;
}
function reqFail(h,d){const r=d.req||{};if((r.str||0)>h.str)return 'STR '+r.str;if((r.dex||0)>h.dex)return 'DEX '+r.dex;if((r.int||0)>h.int)return 'INT '+r.int;return null}
function recalcMax(hi){
  const h=G.heroes[hi];let b=h.base;
  for(const k in h.eq)b+=idef(h.eq[k]).hp||0;

function ringSum(h,key){let s=0;for(const k of RING_SLOTS)if(h.eq[k])s+=idef(h.eq[k])[key]||0;return s}
function heroArmor(h){let a=0;for(const k of ['head','arms','legs','chest','off',...RING_SLOTS]){const it=h.eq[k];if(it)a+=idef(it).armor||0}return a}
function heroDmgRange(h){const w=heroWeapon(h),r=w?w.dmg:(h.unarmed||[1,2]),b=strB(h)+ringSum(h,'dmgb');return [r[0]+b,r[1]+b]}

  const def=ENEMY_DEF[e.t],st=enemyStat(e.t);
  e.hp-=dmg;e.flash=1;e.alert=true;addFloat(e.sx,e.sy-14,String(dmg),'#ffd76a');
  if(e.hp<=0){
    e.dying=.55;G.kills++;sfx(e.t==='skel'?'rattle':'ratdie');
    const gold=rnd(st.gold[0],st.gold[1]);G.gold+=gold;
    msg(`The ${def.name} dies. +${st.xp} XP${gold?`, +${gold} gold`:''}.`,e.t==='boss'?'#ffd76a':'#b8d89a');
    if(e.t==='boss')G.bossDead=true;
    giveXP(st.xp);
  }else{sfx('hit');if(e.t==='rat'&&Math.random()<.5)sfx('squeak')}
}
function heroAttack(i){
  const def=HERO_DEF[i],h=G.heroes[i],w=heroWeapon(h),range=(w&&w.ranged)||1;
  const f=frontEnemy(range);if(!f){msg(range>1?'No target in range.':'There is nothing within reach.');return false}
  const en=ENEMY_DEF[f.e.t].name,verb=range>1?'shoots':'hits';
  if(Math.random()<heroHitPct(i,ENEMY_DEF[f.e.t].fly)){const r=rollDmg(h);msg(`${def.name} ${verb} the ${en} for ${r.d}${r.crit?' (double damage!)':''}.`,r.crit?'#ffd76a':undefined);hurtEnemy(f.e,r.d)}
  else{msg(`${def.name} misses.`,'#a09880');sfx('miss');f.e.alert=true}
  return true;
}
function heroSpecial(i){
  const def=HERO_DEF[i],h=G.heroes[i],sp=specialInfo(i),t=def.sp.type;
  if(h.mp<sp.cost){msg(`${def.name} lacks the ${def.mpn.toLowerCase()}.`,'#d09a80');return false}
  if(t==='melee'||t==='twin'||t==='backstab'||t==='butt'){
    const f=frontEnemy(1);if(!f){msg('There is nothing within reach.');return false}
    const E=f.e,en=ENEMY_DEF[E.t].name;h.mp-=sp.cost;
    if(t==='melee'){
      let d=rollDmg(h,def.sp.m).d+(def.sp.a||0);if(def.sp.undead&&E.t==='skel')d*=2;
      msg(`${def.name} uses ${sp.name} on the ${en} for ${d}!`,'#ffd76a');hurtEnemy(E,d);
    }else if(t==='twin'){
      let tot=0;for(let n=0;n<2;n++)if(Math.random()<heroHitPct(i,ENEMY_DEF[E.t].fly)+.05){const d=rollDmg(h).d;tot+=d;hurtEnemy(E,d);if(E.hp<=0)break}
      msg(tot?`${def.name} stabs twice for ${tot}.`:`${def.name} misses twice.`,tot?'#ffd76a':'#a09880');
    }else if(t==='backstab'){
      const d=rollDmg(h,E.alert?1.5:3).d;msg(`${def.name} ${E.alert?'stabs':'backstabs'} the ${en} for ${d}!`,'#ffd76a');hurtEnemy(E,d);
    }else{
      const d=rnd(3,7)+strB(h),dies=E.hp-d<=0;msg(`${def.name} butts the ${en} for ${d}!`,'#ffd76a');hurtEnemy(E,d);if(!dies)E.chilled=1;
    }
    return true;
  }
  if(t==='shot'||t==='volley'){
    const f=frontEnemy(def.sp.range);if(!f){msg('No target in range.');return false}
    const E=f.e,en=ENEMY_DEF[E.t].name;h.mp-=sp.cost;sfx('miss');let tot=0;
    for(let n=0;n<(t==='volley'?2:1);n++){
      if(E.hp<=0)break;
      if(Math.random()<heroHitPct(i,ENEMY_DEF[E.t].fly)+.05){const d=Math.max(1,Math.round(rollDmg(h,def.sp.m).d));tot+=d;hurtEnemy(E,d)}
    }
    msg(tot?`${def.name}'s ${sp.name} hits the ${en} for ${tot}.`:`${def.name}'s ${sp.name} misses.`,tot?'#ffd76a':'#a09880');
    return true;
  }
  if(t==='spell'){
    if(!sp.spell){msg('No spell is ready. Equip a scroll in the spell tab.','#d09a80');return false}
    const S=SPELLS[sp.spell];
    if(S.self){h.mp-=S.cost;G.lightBoost=40;sfx('heal');msg(`${def.name} conjures a glowing light.`,'#f0e080');return true}
    const f=frontEnemy(S.range);if(!f){msg(`No target in the ${S.n}'s path.`);return false}
    h.mp-=S.cost;const d=rnd(S.dmg[0],S.dmg[1])+intB(h)+magicBonus(h)+(def.sp.bonus||0);
    sfx('fire');msg(`${def.name}'s ${S.n} hits for ${d}!`,S.chill?'#9ad0ff':'#ff9a50');
    if(S.chill&&f.e.hp-d>0){f.e.chilled=1}
    hurtEnemy(f.e,d);return true;
  }
  // priest: heal the most wounded living ally
  let best=-1,bf=2;
  for(const j of livingHeroes()){const fr=G.heroes[j].hp/G.heroes[j].max;if(fr<1&&fr<bf){bf=fr;best=j}}
  if(best<0){msg('Everyone is already healthy.');return false}
  h.mp-=sp.cost;const amt=rnd(8,12)+Math.floor(Math.max(0,h.int-8)/3),tg=G.heroes[best];tg.hp=Math.min(tg.max,tg.hp+amt);
  sfx('heal');msg(`${def.name} heals ${HERO_DEF[best].name} for ${amt}.`,'#9ae0a0');addFloat(portraitX(best)+19,250,'+'+amt,'#7fe08a');
  return true;
}
function usePotion(i){
  const h=G.heroes[i],idx=G.bag.findIndex(b=>b.id==='potion');
  if(idx<0){msg('You have no healing potions.');return false}
  if(h.hp>=h.max){msg(`${HERO_DEF[i].name} is not hurt.`);return false}
  bagTake(idx);const amt=ITEMDEF.potion.heal;h.hp=Math.min(h.max,h.hp+amt);sfx('potion');
  msg(`${HERO_DEF[i].name} drinks a potion (+${amt}).`,'#9ae0a0');addFloat(portraitX(i)+19,250,'+'+amt,'#7fe08a');return true;
}
const portraitX=i=>6+i*40;

/* ---------- round / enemy phase ---------- */
function endRound(){
  G.rounds++;G.acted=[false,false,false,false];
  const es=G.enemies.filter(e=>e.hp>0);
  runEnemies(es,0);
}
function runEnemies(es,i){
  if(G.state!=='play')return;
  while(i<es.length&&es[i].hp<=0)i++;
  if(i>=es.length){finishRound();return}
  const dur=enemyAct(es[i]);
  later(dur,()=>runEnemies(es,i+1));
}
function enemyAttack(e){
  const def=ENEMY_DEF[e.t],st=enemyStat(e.t);
  const l=livingHeroes();if(!l.length)return;
  const pool=[];for(const j of l)for(let k=0;k<(j<2?3:1);k++)pool.push(j);
  const t=pool[rnd(0,pool.length-1)],h=G.heroes[t];
  e.lunge=1;
  const dirToE=DIRS.findIndex(d=>G.P.x+d[0]===e.x&&G.P.y+d[1]===e.y);
  const side=dirToE===G.P.f?'':(dirToE===(G.P.f+2)%4?' from behind':' from the side');
  const hitC=clamp(def.hit-heroArmor(h)*.03,.12,.95),verb=e.t==='skel'?'slashes':'bites';
  if(Math.random()<hitC){
    const d=rnd(st.dmg[0],st.dmg[1]);h.hp-=d;h.hurt=1;G.shake=.35;sfx(e.t==='skel'?'hit':'bite');sfx('hurt');
    msg(`The ${def.name} ${verb} ${HERO_DEF[t].name}${side} for ${d}.`,'#e8a090');addFloat(portraitX(t)+19,250,'-'+d,'#ff6a5a');
    if(h.hp<=0){h.hp=0;h.alive=false;msg(`${HERO_DEF[t].name} has fallen!`,'#ff8a7a');if(G.sel===t)nextHero()}
  }else{sfx('miss');msg(`The ${def.name} attacks ${HERO_DEF[t].name}${side} and misses.`,'#a09880')}
}
function enemyAct(e){
  const def=ENEMY_DEF[e.t],dist=()=>Math.abs(e.x-G.P.x)+Math.abs(e.y-G.P.y);
  if(e.chilled>0){e.chilled--;msg(`The ${def.name} is frozen stiff.`,'#9ad0ff');return 240}
  if(!e.alert){
    const path=bfs(e);
    if(dist()<=6&&((path&&path.dist<=7)||hasLOS(e.x,e.y,G.P.x,G.P.y))){e.alert=true;sfx(e.t==='skel'?'rattle':e.t==='bat'?'screech':'squeak');return 280}
    return 0;
  }
  let dur=0;
  for(let s=0;s<(def.speed||1);s++){
    if(dist()===1){enemyAttack(e);return dur+560}
    let moved=false;
    if(def.fly&&Math.random()<.3){ // bats flutter about
      const opts=DIRS.map(d=>[e.x+d[0],e.y+d[1]]).filter(([x,y])=>!cellBlocked(x,y)&&!enemyAt(x,y)&&!(x===G.P.x&&y===G.P.y));
      if(opts.length){const o=opts[rnd(0,opts.length-1)];e.x=o[0];e.y=o[1];moved=true}
    }else{
      const path=bfs(e);
      if(path&&path.step>=0){e.x=path.step%MW;e.y=(path.step/MW)|0;moved=true}
    }
    if(moved)dur+=240;
  }
  return dur;
}
function finishRound(){
  for(const h of G.heroes)if(h.alive)h.mp=Math.min(h.mpMax,h.mp+1);
  if(G.lightBoost>0)G.lightBoost--;
  if(!livingHeroes().length){later(700,()=>{G.state='dead';sfx('lose')});return}
  if(!G.heroes[G.sel].alive)nextHero();
}

/* ---------- player movement ---------- */
function doTurn(d){
  G.P.f=(G.P.f+d+4)%4;G.P.angT+=d*Math.PI/2;sfx('turn');
}
function pickup(it){
  if(it.k==='key'){G.keys++;it.taken=true;sfx('key');msg('You found a rusty iron key!','#ffd76a');return true}
  const d=ITEMDEF[it.k];
  if(!bagAdd(mkItem(it.k))){msg('Your bag is full.','#d09a80');return false}
  it.taken=true;sfx(it.k==='potion'?'potion':'equip');msg(`You pick up the ${d.n}.`,d.rar?'#e090f0':'#9ae0a0');return true;
}
function takeTorch(L){
  if(!bagAdd(mkItem('torch'))){msg('Your bag is full.','#d09a80');return}
  L.taken=true;torchAt.delete(L.key);sfx('equip');msg('You pull the torch from its bracket.','#ffd090');
}
function doMove(rel){ // rel: 0 forward, 1 right, 2 back, 3 left
  const dir=DIRS[(G.P.f+rel)%4],nx=G.P.x+dir[0],ny=G.P.y+dir[1];
  if(nx<0||ny<0||nx>=MW||ny>=MH){sfx('bump');return}
  const g=G.grid[ny][nx];
  if(g===3){G.grid[ny][nx]=0;sfx('door');msg('You push the door open.');later(260,endRound);return}
  if(g===4){
    if(G.keys>0){G.keys--;G.grid[ny][nx]=0;sfx('door');msg('The rusty key turns. The door groans open.','#ffd76a');later(300,endRound)}
    else{sfx('locked');msg('The door is locked. You need a key.','#d09a80')}
    return;
  }
  if(g===5){G.state='win';sfx('win');return}
  if(g>0||G.decor.some(d=>d.block&&d.x===nx&&d.y===ny)){sfx('bump');G.shake=.12;return}
  const e=enemyAt(nx,ny);
  if(e){msg(`The ${ENEMY_DEF[e.t].name} blocks the way!`);sfx('bump');return}
  G.P.x=nx;G.P.y=ny;sfx('step');reveal();
  for(const it of G.items)if(!it.taken&&it.x===nx&&it.y===ny)pickup(it);
  later(300,endRound);
}
/* tap an object in the 3D view: floor items and wall torches */
function viewTap(x,y){
  if(G.state!=='play'||G.menu||G.map||G.inv.open)return;
  const hits=G.hits.slice().sort((a,b)=>a.ty-b.ty);
  for(const h of hits){
    if(h.type==='item'){
      if(x<h.x0||x>h.x1||y<h.y0||y>h.y1)continue;
      if(h.ty>1.9){msg('Too far away. Step closer.','#d09a80');return}
      pickup(h.ref);return;
    }
    if(Math.hypot(x-h.sx,y-h.sy)>h.r)continue;
    if(h.ty>1.9){msg('Too far away. Step closer.','#d09a80');return}
    takeTorch(h.L);return;
  }
}
function act(id){
  if(G.state==='title'){audioInit();crInit();G.state='create';return}
  if(G.state!=='play')return;
  if(!canAct()){if(['fwd','back','left','right','turnL','turnR'].includes(id))G.queued=id;return}
  G.queued=null;
  const i=G.sel;
  switch(id){
    case 'fwd':doMove(0);break;case 'right':doMove(1);break;case 'back':doMove(2);break;case 'left':doMove(3);break;
    case 'turnL':doTurn(-1);break;case 'turnR':doTurn(1);break;
    case 'attack':if(G.heroes[i].alive&&heroAttack(i))heroDone(i);break;
    case 'special':if(G.heroes[i].alive&&heroSpecial(i))heroDone(i);break;
    case 'potion':if(G.heroes[i].alive&&usePotion(i))heroDone(i);break;
    case 'swapoff':case 'swapalt':if(G.heroes[i].alive&&swapHand(i,id==='swapoff'?'off':'alt')&&hostileNear()&&!G.acted[i])heroDone(i);break;
    case 'wait':msg('The party waits.','#a09880');endRound();break;
  }
}


/* ==========================================================================
   3D RENDERER
   ========================================================================== */
const VW=420,VH=210,HH=VH/2,PL=.75,F=(VW/2)/PL,EYE=.5,AMB=.018;
let RANGE=5.2;
const vc=document.createElement('canvas');vc.width=VW;vc.height=VH;const vctx=vc.getContext('2d');
const vimg=vctx.createImageData(VW,VH);for(let i=3;i<vimg.data.length;i+=4)vimg.data[i]=255;
const zbuf=new Float32Array(VW);
const LUT=new Float32Array(1025);for(let i=0;i<=1024;i++){const t=1-i/1024;LUT[i]=AMB+(t>0?.5*Math.pow(t,1.8):0)}
const baseL=d=>LUT[Math.min(1024,(d*1024/RANGE)|0)];
let nearL=[]; // [x,y,I] flat

function lightSees(ax,ay,bx,by){
  const dx=bx-ax,dy=by-ay,n=Math.ceil(Math.hypot(dx,dy)*6);
  for(let i=1;i<n-1;i++){const x=Math.floor(ax+dx*i/n),y=Math.floor(ay+dy*i/n);if(x<0||y<0||x>=MW||y>=MH||G.grid[y][x]>0)return false}
  return true;
}
function render3D(){
  const t=G.time,C=G.C,dX=Math.cos(C.a),dY=Math.sin(C.a),pX=-dY*PL,pY=dX*PL;
  const cx=C.x+.5-dX*.28,cy=C.y+.5-dY*.28;
  // lights near camera, with flicker
  nearL.length=0;G.hits=[];for(const L of LIGHTS)L._h=null;
  for(const L of LIGHTS){if(L.taken)continue;const d2=(L.x-cx)**2+(L.y-cy)**2;if(d2<100){
    // walls block torchlight: fade each torch in/out by line of sight to the camera
    const tgt=lightSees(cx,cy,L.x,L.y)?1:0;
    L.vis=(L.vis===undefined?tgt:L.vis)+clamp(tgt-(L.vis===undefined?tgt:L.vis),-.06,.06);
    if(L.vis<=.01)continue;
    const fl=.8+.16*Math.sin(t*9+L.ph)+.1*Math.sin(t*23.3+L.ph*2)+.07*Math.sin(t*5.1+L.ph*3);
    nearL.push(L.x,L.y,1.5*fl*L.vis);
    // screen position of the flame so it can be tapped
    const rx=L.x-cx,ry=L.y-cy,tY=(-1/PL)*(-pY*rx+pX*ry),tX=(-1/PL)*(dY*rx-dX*ry);
    if(tY>.3){const sx=VW/2*(1+tX/tY),sy=HH-(.66-EYE)*F/tY,col=Math.floor(sx);
      if(col>=0&&col<VW&&L.vis>.5)L._h={type:'torch',L,sx,sy,r:Math.max(9,.13*F/tY),ty:tY,col}}}
    else L._h=null}
  const nl=nearL,nn=nl.length;
  const D=vimg.data;
  const fd=FLOORD,cd=CEILD;
  const tbR=1,tbG=.94,tbB=.84, ttR=1.3,ttG=.88,ttB=.5;
  // floor + ceiling
  for(let y=HH;y<VH;y++){
    const p=y-HH+.5,rd=EYE*F/p;
    let fx=cx+rd*(dX-pX),fy=cy+rd*(dY-pY);
    const sx=rd*2*pX/VW,sy=rd*2*pY/VW;
    const yo=(y*VW)*4,yc=((VH-1-y)*VW)*4;
    const vg=1-.3*Math.pow(p/HH,2.2);
    for(let x=0;x<VW;x++,fx+=sx,fy+=sy){
      const cxl=Math.floor(fx),cyl=Math.floor(fy);
      let u=((fx-cxl)*TS)|0,v=((fy-cyl)*TS)|0;
      const hv=(Math.imul(cxl,73856093)^Math.imul(cyl,19349663))&3;
      if(hv===1){const tmp=u;u=v;v=tmp}else if(hv===2)u=127-u;else if(hv===3)v=127-v;
      const dx=fx-cx,dy=fy-cy,dist=Math.sqrt(dx*dx+dy*dy);
      const lb=baseL(dist);let lt=0;
      for(let k=0;k<nn;k+=3){const ax=fx-nl[k],ay=fy-nl[k+1];lt+=nl[k+2]/(1+1.15*(ax*ax+ay*ay))}
      const kR=(lb*tbR+lt*ttR)*vg,kG=(lb*tbG+lt*ttG)*vg,kB=(lb*tbB+lt*ttB)*vg;
      const ti=(v*TS+u)*4,io=yo+x*4,ic=yc+x*4;
      D[io]=fd[ti]*kR;D[io+1]=fd[ti+1]*kG;D[io+2]=fd[ti+2]*kB;
      D[ic]=cd[ti]*kR*.85;D[ic+1]=cd[ti+1]*kG*.85;D[ic+2]=cd[ti+2]*kB*.85;
    }
  }
  // walls
  const grid=G.grid,seen=G.seen,fr=Math.floor(t*7.5);
  for(let x=0;x<VW;x++){
    const camX=2*x/VW-1,rX=dX+pX*camX,rY=dY+pY*camX;
    let mx=Math.floor(cx),my=Math.floor(cy);
    const ddx=Math.abs(1/rX),ddy=Math.abs(1/rY);
    let stx,sty,sdx,sdy;
    if(rX<0){stx=-1;sdx=(cx-mx)*ddx}else{stx=1;sdx=(mx+1-cx)*ddx}
    if(rY<0){sty=-1;sdy=(cy-my)*ddy}else{sty=1;sdy=(my+1-cy)*ddy}
    let side=0,g=0,guard=0;
    while(guard++<40){
      if(sdx<sdy){sdx+=ddx;mx+=stx;side=0}else{sdy+=ddy;my+=sty;side=1}
      if(mx<0||my<0||mx>=MW||my>=MH){g=1;break}
      if(Math.min(sdx,sdy)<7)seen[my][mx]=1;
      g=grid[my][mx];if(g>0)break;
    }
    let perp=side===0?sdx-ddx:sdy-ddy;if(perp<.05)perp=.05;
    zbuf[x]=perp;
    const hx=cx+rX*perp,hy=cy+rY*perp;
    let wx=side===0?hy:hx;wx-=Math.floor(wx);
    let tx=(wx*TS)|0;
    if((side===0&&rX>0)||(side===1&&rY<0))tx=TS-1-tx;
    const face=side===0?(stx>0?3:1):(sty>0?0:2);
    let ti;
    if(g===1)ti=T_STONE;else if(g===2)ti=T_BRICK;else if(g===3)ti=T_DOOR;else if(g===4)ti=T_LOCK;else ti=T_EXIT;
    if((g===1||g===2)&&torchAt.has((my*MW+mx)*4+face)){
      const ph=((mx*7+my*3)&3);ti=(g===1?T_TORCH_STONE:T_TORCH_BRICK)+((fr+ph)&3);
    }
    const tex=TEX[ti],td=tex.d,te=tex.e;
    const dist=perp*Math.hypot(rX,rY);
    const lb=baseL(dist);let lt=0;
    const px=hx-(side===0?stx*.03:0),py=hy-(side===1?sty*.03:0);
    for(let k=0;k<nn;k+=3){const ax=px-nl[k],ay=py-nl[k+1];lt+=nl[k+2]/(1+1.15*(ax*ax+ay*ay))}
    const kR=lb*tbR+lt*ttR,kG=lb*tbG+lt*ttG,kB=lb*tbB+lt*ttB;
    const lineH=F/perp,y0=HH-lineH/2;
    const ds=Math.max(0,Math.ceil(y0)),de=Math.min(VH-1,Math.floor(HH+lineH/2));
    const stepT=TS/lineH;
    let tyf=(ds-y0)*stepT;
    for(let y=ds;y<=de;y++,tyf+=stepT){
      const v=tyf>=TS?TS-1:(tyf|0);
      const i=(v*TS+tx)*4,o=(y*VW+x)*4;
      const vy=(y-HH)/HH,vg=1-.28*vy*vy;
      let R=td[i]*kR*vg,Gc=td[i+1]*kG*vg,B=td[i+2]*kB*vg;
      if(te){const a=te[i+3]/255;R+=te[i]*a*.95;Gc+=te[i+1]*a*.95;B+=te[i+2]*a*.95}
      D[o]=R;D[o+1]=Gc;D[o+2]=B;
    }
  }
  vctx.putImageData(vimg,0,0);
  for(const L of LIGHTS){const h=L._h;if(!L.taken&&h&&h.col>=0&&h.ty<=zbuf[h.col]+.45)G.hits.push(h)}
  drawSprites(cx,cy,dX,dY,pX,pY);
}
const tmpC=document.createElement('canvas');tmpC.width=640;tmpC.height=480;const tmpX=tmpC.getContext('2d');
function spriteList(){
  const L=[];
  for(const e of G.enemies){
    if(e.hp<=0&&e.dying<=0)continue;
    const def=ENEMY_DEF[e.t];
    L.push({x:e.rx+.5,y:e.ry+.5,img:IMG[def.img]||(e.t==='boss'?IMG._fbBoss:IMG._fbRat),w:def.w,e,
      bob:def.fly?.3+Math.sin(G.time*6+e.seed)*.08:Math.sin(G.time*3+e.seed)*.015,lunge:e.lunge,flash:e.flash,fade:e.hp<=0?e.dying/.55:1,sink:e.hp<=0?1-e.dying/.55:0});
  }
  for(const it of G.items)if(!it.taken){const d=ITEMDEF[it.k];L.push({x:it.x+.5,y:it.y+.5,img:IMG['it_'+it.k]||IMG[it.k],w:it.k==='key'?.32:(d?d.sw:.3)*1.1,item:it})}
  for(const d of G.decor)L.push({x:d.x+.5,y:d.y+.5,img:IMG[d.k],w:d.k==='barrel'?.62:d.k==='coffin'?.92:.7});
  return L;
}
function drawSprites(cx,cy,dX,dY,pX,pY){
  const inv=-1/PL,list=spriteList(),proj=[];
  for(const s of list){
    const rx=s.x-cx,ry=s.y-cy;
    const tX=inv*(dY*rx-dX*ry),tY=inv*(-pY*rx+pX*ry);
    if(tY<.25)continue;
    s.tX=tX;s.tY=tY;proj.push(s);
  }
  proj.sort((a,b)=>b.tY-a.tY);
  for(const s of proj){
    const img=s.img;if(!img)continue;
    const iw=img.width,ih=img.height,ty=s.tY;
    let sw=F*s.w/ty;sw*= (1+s.lunge*.28);
    const sh=sw*ih/iw*(1-(s.sink||0)*.6);
    const scrX=VW/2*(1+s.tX/ty)+(s.flash>0?Math.sin(G.time*60)*2.5*s.flash:0);
    const bottom=HH+EYE*F/ty-(s.bob||0)*F/ty+(s.sink||0)*sh*.25;
    const left=scrX-sw/2,top=bottom-sh;
    if(s.e){s.e.sx=scrX;s.e.sy=top+sh*.45}
    if(s.item)G.hits.push({type:'item',ref:s.item,x0:left,x1:left+sw,y0:top-4,y1:bottom+2,ty})
    // lighting
    const wx=s.x,wy=s.y,dist=Math.hypot(wx-cx,wy-cy);
    let lt=0;for(let k=0;k<nearL.length;k+=3){const ax=wx-nearL[k],ay=wy-nearL[k+1];lt+=nearL[k+2]/(1+1.15*(ax*ax+ay*ay))}
    const lum=clamp(.08+(baseL(dist)+lt*.85)*1.05,0,1);
    tmpX.clearRect(0,0,iw,ih);tmpX.globalCompositeOperation='source-over';tmpX.globalAlpha=1;
    tmpX.drawImage(img,0,0);
    tmpX.globalCompositeOperation='source-atop';
    tmpX.fillStyle=`rgba(8,5,3,${(1-lum).toFixed(3)})`;tmpX.fillRect(0,0,iw,ih);
    if(s.flash>0){tmpX.fillStyle=`rgba(255,70,40,${(s.flash*.55).toFixed(3)})`;tmpX.fillRect(0,0,iw,ih)}
    if(s.fade!==undefined&&s.fade<1){vctx.globalAlpha=Math.max(0,s.fade)}
    let x0=Math.max(0,Math.floor(left)),x1=Math.min(VW,Math.ceil(left+sw));
    let run=-1;
    for(let x=x0;x<=x1;x++){
      const vis=x<x1&&zbuf[x]>ty;
      if(vis&&run<0)run=x;
      if((!vis||x===x1)&&run>=0){
        const u0=(run-left)/sw*iw,u1=(x-left)/sw*iw;
        vctx.drawImage(tmpC,u0,0,Math.max(.5,u1-u0),ih,run,top,x-run,sh);
        run=-1;
      }
    }
    vctx.globalAlpha=1;
  }
}

function setupLights(){
  LIGHTS.length=0;torchAt.clear();
  const cands=[];
  for(let y=1;y<MH-1;y++)for(let x=1;x<MW-1;x++){
    const g=G.grid[y][x];if(g!==1&&g!==2)continue;
    for(let f=0;f<4;f++){
      const nx=x+DIRS[f][0],ny=y+DIRS[f][1];
      if(G.grid[ny][nx]===0&&!G.decor.some(d=>d.block&&d.x===nx&&d.y===ny))cands.push([x,y,f]);
    }
  }
  cands.sort((a,b)=>hash2(a[0],a[1],a[2]*7+3)-hash2(b[0],b[1],b[2]*7+3));
  const out=[];
  for(const c of cands)if(!out.some(t=>Math.hypot(t[0]-c[0],t[1]-c[1])<6.2))out.push(c);
  for(const [x,y,f] of out){
    const d=DIRS[f],key=(y*MW+x)*4+f;
    torchAt.set(key,true);
    LIGHTS.push({x:x+.5+d[0]*.62,y:y+.5+d[1]*.62,ph:hash2(x,y,5)*6.28,key,taken:false});
  }
}

function openInv(i){

function slotTap(slot){
  const I=G.inv,hi=I.hero,h=G.heroes[hi];
  if(I.sel&&I.sel.src==='bag'){
    if(equipTo(hi,slot,I.sel.i))I.sel={src:'slot',slot};
    return;
  }
  if(h.eq[slot]){
    if(I.sel&&I.sel.src==='slot'&&I.sel.slot===slot)I.sel=null;else I.sel={src:'slot',slot};
    if(slot[0]==='s')h.spellSel=+slot[1];
  }else{I.sel=null;if(I.tab!=='spell'||HERO_DEF[hi].caster)msg(`Empty ${SLOT_LABEL[slot].toLowerCase()} slot.`,'#a89878')}
}
function invBtn(id){
  const I=G.inv,hi=I.hero,h=G.heroes[hi];
  if(id==='iclose'){I.open=false;return}
  if(id.startsWith('ihero')){I.hero=+id.slice(5);I.sel=null;I.scroll=I.scroll;if(G.heroes[I.hero].alive)G.sel=I.hero;return}
  if(id.startsWith('itab_')){I.tab=id.slice(5);I.sel=null;return}
  if(id.startsWith('ibag')&&id!=='ibagarea'){const i=+id.slice(4);I.sel=(I.sel&&I.sel.src==='bag'&&I.sel.i===i)?null:(G.bag[i]?{src:'bag',i}:null);return}
  if(id.startsWith('islot_')){slotTap(id.slice(6));return}
  if(id==='iequip'){
    const it=selItem();if(!it||I.sel.src!=='bag')return;
    const slot=autoSlot(hi,idef(it));
    if(!slot){msg('Only the mage can use spell scrolls.','#d09a80');return}
    if(equipTo(hi,slot,I.sel.i))I.sel={src:'slot',slot};
    return;
  }
  if(id==='iunequip'){if(I.sel&&I.sel.src==='slot'&&unequip(hi,I.sel.slot))I.sel=null;return}
  if(id==='iuse'||id==='ipotion'){
    if(!h.alive){msg('The dead cannot drink.');return}
    if(usePotion(hi)){
      I.sel=null;
      if(hostileNear()&&!G.acted[hi])heroDone(hi);
    }
    return;
  }
  if(id==='isort'){
    G.bag.sort((a,b)=>(KIND_ORDER[idef(a).k]-KIND_ORDER[idef(b).k])||idef(a).n.localeCompare(idef(b).n));I.sel=null;return;
  }
}

function illum(x,y,w,h,seed){
  const kind=Math.floor(hash2(seed,5,1)*3),right=hash2(seed,6,2)<.5;
  ctx.save();ctx.lineCap='round';ctx.lineJoin='round';
  const dir=right?-1:1,sx=right?x+w-5:x+5,sy=y+1.6;
  const ink='#3e301a',gold='#9a8644',leaf='#566c54',red='#82362e',blue='#38567e';
  if(kind===0){ // creeping vine with leaves and a berry
    ctx.strokeStyle=ink;ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(sx,sy);ctx.bezierCurveTo(sx+dir*7,sy-4,sx+dir*11,sy+3,sx+dir*18,sy);ctx.bezierCurveTo(sx+dir*24,sy-3,sx+dir*27,sy+3,sx+dir*32,sy);ctx.stroke();
    for(const t of [8,19,29]){ctx.fillStyle=leaf;ctx.beginPath();ctx.ellipse(sx+dir*t,sy+(t===19?-3:3),3.2,1.5,dir*.7,0,TAU);ctx.fill();ctx.strokeStyle=ink;ctx.lineWidth=.5;ctx.stroke()}
    ctx.fillStyle=red;ctx.beginPath();ctx.arc(sx+dir*14,sy+2.4,1.5,0,TAU);ctx.fill();ctx.fillStyle=gold;ctx.beginPath();ctx.arc(sx+dir*33,sy,1.3,0,TAU);ctx.fill();
  }else if(kind===1){ // interlaced knotwork
    for(let i=0;i<3;i++){ctx.strokeStyle=ink;ctx.lineWidth=2.4;ctx.beginPath();ctx.ellipse(sx+dir*(6+i*7),sy+1,4.5,2.6,i%2?.5:-.5,0,TAU);ctx.stroke();
      ctx.strokeStyle=gold;ctx.lineWidth=1.2;ctx.beginPath();ctx.ellipse(sx+dir*(6+i*7),sy+1,4.5,2.6,i%2?.5:-.5,0,TAU);ctx.stroke()}
    ctx.fillStyle=blue;ctx.beginPath();ctx.arc(sx,sy+1,1.4,0,TAU);ctx.fill();
  }else{ // a tiny wyrm
    ctx.strokeStyle=ink;ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(sx+dir*24,sy+2);ctx.bezierCurveTo(sx+dir*18,sy-3,sx+dir*12,sy+5,sx+dir*6,sy+1);ctx.bezierCurveTo(sx+dir*3,sy-1,sx+dir*1,sy,sx,sy-1);ctx.stroke();
    ctx.strokeStyle=leaf;ctx.lineWidth=1.8;ctx.beginPath();ctx.moveTo(sx+dir*24,sy+2);ctx.bezierCurveTo(sx+dir*18,sy-3,sx+dir*12,sy+5,sx+dir*6,sy+1);ctx.bezierCurveTo(sx+dir*3,sy-1,sx+dir*1,sy,sx,sy-1);ctx.stroke();
    ctx.fillStyle=leaf;ctx.beginPath();ctx.arc(sx,sy-1,2.2,0,TAU);ctx.fill();ctx.fillStyle=red;ctx.fillRect(sx-1,sy-2,1.2,1.2);
    ctx.strokeStyle=gold;ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(sx+dir*24,sy+2);ctx.lineTo(sx+dir*28,sy-1);ctx.stroke();
  }
  ctx.restore();
}

const blankHero=()=>({app:-1,cls:-1,name:'',bs:0,bd:0,bi:0});
function randName(cls){
  const used=new Set(G.cr?G.cr.party.filter(Boolean).map(p=>p.name):[]);
  const pool=(CLASSES[cls]&&CLASSES[cls].name==='Goat'?GOAT_NAMES:NAME_POOL).filter(n=>!used.has(n));
  return pool[rnd(0,pool.length-1)]||'Hero';
}
function crInit(){
  let saved=null;try{saved=JSON.parse(localStorage.getItem('abbeyParty'))}catch(e){}
  const ok=Array.isArray(saved)&&saved.length===4&&saved.every(p=>p&&CLASSES[p.cls]&&p.app>=0&&p.app<NPORT&&p.name);
  G.cr={slot:0,step:ok?'done':'look',page:0,note:'',party:ok?saved:[null,null,null,null],cur:ok?Object.assign({},saved[0]):blankHero()};
}
function startGame(){
  const C=G.cr;setParty(C.party);
  try{localStorage.setItem('abbeyParty',JSON.stringify(C.party))}catch(e){}
  reset();G.state='play';audioInit();

}
function drawCover(img,x,y,w,h){
  if(!img){ctx.fillStyle='#1a1410';ctx.fillRect(x,y,w,h);return}
  const sc=Math.max(w/img.width,h/img.height),sw=w/sc,sh=h/sc;
  ctx.drawImage(img,(img.width-sw)/2,(img.height-sh)/2,sw,sh,x,y,w,h);
}

function crBtn(id){
  const C=G.cr,cur=C.cur;C.note='';
  if(id.startsWith('cr_slot')){
    const i=+id.slice(7);C.slot=i;C.cur=C.party[i]?Object.assign({},C.party[i]):blankHero();C.step='look';
    if(C.party[i])C.page=Math.floor(C.party[i].app/8);return;
  }
  if(id==='cr_pgL'){C.page=(C.page+PAGES-1)%PAGES;return}
  if(id==='cr_pgR'){C.page=(C.page+1)%PAGES;return}
  if(id.startsWith('cr_app')){cur.app=+id.slice(6);if(cur.cls<0)C.step='job';return}
  if(id.startsWith('cr_cls')){const n=+id.slice(6);if(cur.cls!==n){cur.cls=n;cur.bs=cur.bd=cur.bi=0}return}
  if(id==='cr_ok'){
    if(C.step==='look'){if(cur.app>=0)C.step='job';else C.note='Choose an appearance first.'}
    else if(C.step==='job'){if(cur.cls>=0)C.step='stats';else C.note='Choose an occupation first.'}
    else if(C.step==='stats'){
      if(crFree(cur)>0){C.note='Distribute all the free points first.';return}
      if(!cur.name)cur.name=randName(cur.cls);
      C.party[C.slot]=Object.assign({},cur);
      const nx=C.party.findIndex(p=>!p);
      if(nx>=0){C.slot=nx;C.cur=blankHero();C.step='look'}else C.step='done';
    }
    return;
  }
  if(id==='cr_back'){if(C.step==='stats')C.step='job';else if(C.step==='job')C.step='look';return}
  if(id==='cr_start'){if(C.party.every(Boolean))startGame();else C.note='Create all four heroes first.';return}
  if(id==='cr_default'){C.party=DEFAULT_PARTY.map(p=>Object.assign({},p));C.slot=0;C.cur=Object.assign({},C.party[0]);C.step='done';return}
  if(id==='cr_rand'){cur.name=randName(cur.cls);return}
  if(id==='cr_name'){
    let n=null;try{n=prompt('Name this hero (12 letters at most):',cur.name||randName(cur.cls))}catch(e){}
    if(n&&n.trim())cur.name=n.trim().slice(0,12);return;
  }
  const m=id.match(/^cr_(bs|bd|bi)([+-])$/);
  if(m&&cur.cls>=0){
    if(m[2]==='+'){if(crFree(cur)>0)cur[m[1]]++}else if(cur[m[1]]>0)cur[m[1]]--;
  }
}

function drawMinimap(x,y,w,h){
  ctx.save();ctx.fillStyle='#0b0907';ctx.fillRect(x,y,w,h);
  const cs=Math.min((w-4)/MW,(h-4)/MH),ox=x+(w-cs*MW)/2,oy=y+(h-cs*MH)/2;
  drawMapCells(ox,oy,cs);
  ctx.restore();
  ctx.lineWidth=2;ctx.strokeStyle=goldG(x,y,w,h);rrect(ctx,x+1,y+1,w-2,h-2,4);ctx.stroke();
}
function drawMapCells(ox,oy,cs){
  for(let y=0;y<MH;y++)for(let x=0;x<MW;x++){
    if(!G.seen[y][x])continue;
    const g=G.grid[y][x];
    ctx.fillStyle=g===0?'#7a6446':g===3?'#a8702e':g===4?'#c03a2a':g===5?'#7ab0f0':'#45403a';
    if(g===0&&G.decor.some(d=>d.block&&d.x===x&&d.y===y))ctx.fillStyle='#4a3a28';
    ctx.fillRect(ox+x*cs,oy+y*cs,cs,cs);
    if(g>0&&g<3){ctx.fillStyle='rgba(255,255,255,.07)';ctx.fillRect(ox+x*cs,oy+y*cs,cs,Math.max(1,cs*.2))}
  }
  const px=ox+(G.P.x+.5)*cs,py=oy+(G.P.y+.5)*cs;
  ctx.save();ctx.translate(px,py);ctx.rotate(G.P.f*Math.PI/2);ctx.fillStyle='#ffe36a';ctx.beginPath();ctx.moveTo(0,-cs*.75);ctx.lineTo(cs*.55,cs*.5);ctx.lineTo(0,cs*.15);ctx.lineTo(-cs*.55,cs*.5);ctx.closePath();ctx.fill();ctx.strokeStyle='#000';ctx.lineWidth=.8;ctx.stroke();ctx.restore();
}

function drawFloats(dt){
  for(let i=G.floats.length-1;i>=0;i--){
    const f=G.floats[i];f.t+=dt;if(f.t>1.1){G.floats.splice(i,1);continue}

function bigPanel(x,y,w,h){illum(x,y,w,h,(x+y)|0);ctx.save();ctx.fillStyle='rgba(10,8,6,.92)';rrect(ctx,x,y,w,h,8);ctx.fill();ctx.restore();ctx.lineWidth=3;ctx.strokeStyle=goldG(x,y,w,h);rrect(ctx,x,y,w,h,8);ctx.stroke();ctx.lineWidth=1;ctx.strokeStyle='rgba(255,230,150,.25)';rrect(ctx,x+5,y+5,w-10,h-10,5);ctx.stroke()}
function btnText(id,label,x,y,w,h){panel(x,y,w,h,false,false);txt(label,x+w/2,y+h/2,11,'#c9ba8e','center',true);btn(id,x,y,w,h)}

  txtS('Four companions descend into the crypts beneath the abbey',210,134,10,'#d8c9a0','center');
  const a=.55+.45*Math.sin(G.time*3);ctx.globalAlpha=a;txtS('Tap or press any key to descend',210,176,12,'#e0d29a','center',true);ctx.globalAlpha=1;

}
function drawMenu(){
  BTNS=[];veil(.6);bigPanel(90,30,300,260);
  txt('MENU',240,50,14,'#d8c88e','center',true);
  btnText('resume','Resume',170,66,140,26);
  btnText('mute',G.mute?'Sound: Off':'Sound: On',170,98,140,26);
  btnText('restart','Restart dungeon',170,130,140,26);
  btnText('newparty','New party',170,162,140,26);
  const L=['Arrows / WASD: move and turn   Q / E: step sideways','Space: attack   X: special   P: potion   Z: wait','1-4: choose hero   I: inventory   M: map   Esc: menu','',
    'Tap a portrait to open that hero\'s inventory.','Tap torches and items in the view to pick them up.','Heroes act once per round, then the monsters move.','Heroes gain experience from kills. Monsters match the dungeon level.'];
  L.forEach((s,i)=>txt(s,240,200+i*11.5,8,'#d8c9a0','center'));
  btn('menuclose',0,0,DW,DH); BTNS.unshift(BTNS.pop());
}
function drawFullMap(){
  BTNS=[];veil(.82);
  const cs=Math.floor(Math.min((DW-20)/MW,(DH-44)/MH)),ox=(DW-cs*MW)/2,oy=(DH-cs*MH)/2-8;
  ctx.fillStyle='#0b0907';ctx.fillRect(ox-6,oy-6,cs*MW+12,cs*MH+12);ctx.lineWidth=2.5;ctx.strokeStyle=goldG(ox,oy,cs*MW,cs*MH);ctx.strokeRect(ox-6,oy-6,cs*MW+12,cs*MH+12);
  drawMapCells(ox,oy,cs);
  for(const it of G.items)if(!it.taken&&G.seen[it.y][it.x]){ctx.fillStyle=it.k==='key'?'#ffd76a':ITEMDEF[it.k]&&ITEMDEF[it.k].rar?'#e070e8':'#e04a40';ctx.beginPath();ctx.arc(ox+(it.x+.5)*cs,oy+(it.y+.5)*cs,cs*.22,0,TAU);ctx.fill()}
  txtS(`Below the Abbey - Level ${LEVEL}`,240,oy+cs*MH+16,10,'#d8c88e','center',true);

}

  BTNS=[];veil(.72);bigPanel(100,50,280,220);
  if(win){

    txt('Up the worn steps, daylight at last.',240,110,10,'#d8c9a0','center');
    txt(G.bossDead?'The Rat King is dead and the crypts are quiet.':'The Rat King still lurks in the crypts...',240,128,10,G.bossDead?'#b8e8a0':'#d8a888','center');

    txt('The crypts keep their secrets.',240,110,10,'#d8c9a0','center');
  }
  txt(`Creatures slain: ${G.kills}     Rounds: ${G.rounds}`,240,156,11,'#d0c298','center');
  txt(`Survivors: ${livingHeroes().length} of 4     Gold: ${G.gold}`,240,174,11,'#d0c298','center');
  txt('Levels: '+G.heroes.map(h=>h.lvl).join('  '),240,192,11,'#d0c298','center');

/* ==========================================================================
   LOOP / INPUT
   ========================================================================== */
function update(dt){
  G.time+=dt;
  // timers
  for(let i=0;i<G.timers.length;){const t=G.timers[i];if(G.time>=t.t){G.timers.splice(i,1);t.fn()}else i++}
  // camera easing
  const C=G.C,P=G.P;
  const mv=dt*5.2;C.x+=clamp(P.x-C.x,-mv,mv);C.y+=clamp(P.y-C.y,-mv,mv);
  const ma=dt*7.5;C.a+=clamp(P.angT-C.a,-ma,ma);
  // entity animation
  for(const e of G.enemies){
    const s=dt*3.6;e.rx+=clamp(e.x-e.rx,-s,s);e.ry+=clamp(e.y-e.ry,-s,s);
    if(e.flash>0)e.flash=Math.max(0,e.flash-dt*3.5);
    if(e.lunge>0)e.lunge=Math.max(0,e.lunge-dt*3.2);
    if(e.hp<=0&&e.dying>0)e.dying=Math.max(0,e.dying-dt);
  }
  for(const h of G.heroes){if(h.hurt>0)h.hurt=Math.max(0,h.hurt-dt*2.6);if(h.lvlFlash>0)h.lvlFlash=Math.max(0,h.lvlFlash-dt)}
  { // party light eases towards the best light being carried
    const target=Math.max(partyLight(),G.lightBoost>0?1.1:0);
    const prev=G.lightLevel;G.lightLevel+=clamp(target-prev,-dt*1.5,dt*1.5);
    if(Math.abs(G.lightLevel-(update._set||0))>.01){update._set=G.lightLevel;setLightLevel(G.lightLevel)}
  }
  if(G.shake>0)G.shake=Math.max(0,G.shake-dt*1.6);
  // held d-pad repeat, queued input
  if(G.hold&&G.time>=G.hold.t){act(G.hold.id);G.hold.t=G.time+.16}
  if(G.queued&&canAct()){const q=G.queued;G.queued=null;act(q)}
}
let last=performance.now();
function frame(now){
  const dt=Math.min(.05,(now-last)/1000);last=now;
  update(dt);
  if(window.__ready){render3D();ctx.setTransform(2,0,0,2,0,0);ui(dt)}
  requestAnimationFrame(frame);
}
function handleBtn(id){
  if(G.state==='title'){act('start');return}
  if(G.state==='create'){crBtn(id);return}
  if(G.state==='win'||G.state==='dead'){if(id==='restart'){reset();G.state='play'}return}
  if(G.inv.open){invBtn(id);return}
  if(G.map){if(id==='mapclose'||id==='map')G.map=false;return}
  if(G.menu){
    if(id==='resume'||id==='menuclose'||id==='menu')G.menu=false;
    else if(id==='mute'){G.mute=!G.mute}
    else if(id==='newparty'){G.menu=false;crInit();G.state='create'}
    else if(id==='restart'){reset();G.state='play';audioInit();msg('You wake in the crypts below the abbey. Something is scratching in the dark...')}
    return;
  }
  if(id==='menu'){G.menu=true;return}
  if(id==='map'){G.map=true;return}
  if(id.startsWith('hero')){openInv(+id.slice(4));return}
  act(id);
  if(['fwd','back','left','right','turnL','turnR'].includes(id))G.hold={id,t:G.time+.42};
}
function toDesign(e){const r=cv.getBoundingClientRect();return [(e.clientX-r.left)/r.width*DW,(e.clientY-r.top)/r.height*DH]}
let PTR=null;
cv.addEventListener('pointerdown',e=>{
  e.preventDefault();audioInit();
  const [x,y]=toDesign(e);
  for(let i=BTNS.length-1;i>=0;i--){const b=BTNS[i];if(x>=b.x&&x<b.x+b.w&&y>=b.y&&y<b.y+b.h){
    if(b.up){PTR={b,x,y,sc:G.inv.scroll,moved:false}}else handleBtn(b.id);
    return;
  }}
  if(x<420&&y<210&&G.state==='play')viewTap(x,y); // tap an object in the 3D view
});
cv.addEventListener('pointermove',e=>{
  if(!PTR)return;const [x,y]=toDesign(e),dy=y-PTR.y;
  if(Math.abs(dy)>5)PTR.moved=true;
  if(PTR.moved&&PTR.b.drag)G.inv.scroll=clamp(PTR.sc-dy,0,maxScroll());
});
function ptrEnd(){G.hold=null;if(PTR){const p=PTR;PTR=null;if(!p.moved&&p.b.id!=='ibagarea')handleBtn(p.b.id)}}
addEventListener('pointerup',ptrEnd);
addEventListener('pointercancel',()=>{G.hold=null;PTR=null});
cv.addEventListener('wheel',e=>{if(G.inv.open){G.inv.scroll=clamp(G.inv.scroll+e.deltaY*.5,0,maxScroll());e.preventDefault()}},{passive:false});
cv.addEventListener('contextmenu',e=>e.preventDefault());
const KEYMAP={ArrowUp:'fwd',w:'fwd',W:'fwd',ArrowDown:'back',s:'back',S:'back',ArrowLeft:'turnL',a:'turnL',A:'turnL',ArrowRight:'turnR',d:'turnR',D:'turnR',q:'left',Q:'left',e:'right',E:'right',' ':'attack',Enter:'attack',x:'special',X:'special',p:'potion',P:'potion',z:'wait',Z:'wait'};
addEventListener('keydown',e=>{
  if(e.ctrlKey||e.metaKey||e.altKey)return;
  audioInit();
  if(G.state==='title'){act('start');e.preventDefault();return}
  if(G.state==='create'){if(e.key==='Enter'){crBtn(G.cr.step==='done'?'cr_start':'cr_ok');e.preventDefault()}return}
  if(G.state==='win'||G.state==='dead'){if(e.key==='Enter'||e.key===' '){reset();G.state='play'}return}
  if(e.key==='Escape'){if(G.inv.open){G.inv.open=false}else{G.menu=!G.menu;G.map=false}e.preventDefault();return}
  if(e.key==='i'||e.key==='I'){if(G.inv.open)G.inv.open=false;else openInv(G.sel);e.preventDefault();return}
  if(e.key==='m'||e.key==='M'){G.map=!G.map;G.menu=false;return}
  if(G.menu||G.map||G.inv.open)return;
  if(e.key>='1'&&e.key<='4'){const i=+e.key-1;if(G.heroes[i].alive)G.sel=i;return}
  const id=KEYMAP[e.key];if(id){e.preventDefault();act(id)}
});
function fit(){
  const s=Math.min(innerWidth/DW,innerHeight/DH),w=Math.floor(DW*s),h=Math.floor(DH*s);
  cv.style.width=w+'px';cv.style.height=h+'px';cv.style.left=Math.floor((innerWidth-w)/2)+'px';cv.style.top=Math.floor((innerHeight-h)/2)+'px';
}
addEventListener('resize',fit);fit();

/* ---------- boot ---------- */
(async function boot(){
  buildTextures();
  makeProps();makeItemSprites();
  IMG._fbRat=fallbackRat(false);IMG._fbBoss=fallbackRat(true);
  for(let i=0;i<4;i++)IMG['_pf'+i]=heroFallback(i);
  try{await Promise.race([Promise.all([document.fonts.load("16px 'IM Fell English SC'"),document.fonts.load("16px 'IM Fell English'"),document.fonts.load("16px 'UnifrakturCook'")]),new Promise(r=>setTimeout(r,2500))])}catch(e){}
  await Promise.all([loadImg('rat','assets/rat.png'),loadImg('boss','assets/boss.png'),loadImg('bat','assets/bat.png'),loadImg('skel','assets/skel.png'),...Array.from({length:NPORT},(_,i)=>loadImg('pt'+i,'assets/pt/'+i+'.png'))]);
  reset();buildUIPatterns();
  window.__ready=true;
  requestAnimationFrame(frame);
})();
