<script>
'use strict';
/* ==========================================================================
   BELOW THE ABBEY  -  a small grid-based first-person dungeon crawler
   Design space 480x320 (canvas is 2x).  3D viewport is 420x210 design units.
   ========================================================================== */
const VERSION='0.34';
const FUI="'IM Fell English SC',Georgia,serif", FTXT="'IM Fell English',Georgia,serif", FTITLE="'UnifrakturCook','IM Fell English SC',Georgia,serif";
const DW=480, DH=320;
const cv=document.getElementById('c'), ctx=cv.getContext('2d');
ctx.imageSmoothingEnabled=true; ctx.imageSmoothingQuality='high';

/* ---------- small utils ---------- */
const TAU=Math.PI*2;
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const rnd=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
function hash2(x,y,s){let h=Math.imul(x|0,374761393)+Math.imul(y|0,668265263)+Math.imul(s|0,1274126177);h=Math.imul(h^(h>>>13),1274126177);return((h^(h>>>16))>>>0)/4294967296}
function vnoise(x,y,p,s){
  const xi=Math.floor(x),yi=Math.floor(y),xf=x-xi,yf=y-yi,u=xf*xf*(3-2*xf),v=yf*yf*(3-2*yf);
  const m=(a,b)=>hash2(((a%p)+p)%p,((b%p)+p)%p,s);
  return(m(xi,yi)*(1-u)+m(xi+1,yi)*u)*(1-v)+(m(xi,yi+1)*(1-u)+m(xi+1,yi+1)*u)*v;
}
function fbm(x,y,s){let t=0,a=.5,f=4,n=0;for(let o=0;o<4;o++){t+=a*vnoise(x*f,y*f,f,s+o*17);n+=a;a*=.5;f*=2}return t/n}
const smooth=(a,b,x)=>{const t=clamp((x-a)/(b-a),0,1);return t*t*(3-2*t)};

/* ==========================================================================
   TEXTURES (procedural, painted-stone look)
   ========================================================================== */
const TS=128;
function stoneTex(seed,o){
  const d=new Uint8ClampedArray(TS*TS*4), rh=TS/o.rows;
  for(let y=0;y<TS;y++)for(let x=0;x<TS;x++){
    const r=Math.floor(y/rh), n=o.cols(r), bw=TS/n;
    const off=o.stag===1?(r%2)*bw/2:(o.stag===2?hash2(r,5,seed)*bw:0);
    const xx=(x+off)%TS, c=Math.floor(xx/bw), bx=xx-c*bw, by=y-r*rh;
    const id=hash2(c,r,seed+11);
    const dl=bx,dr=bw-1-bx,dt=by,db=rh-1-by;
    const mm=Math.min(dl,dr,dt,db)+(hash2(x>>2,y>>2,seed)-.5)*1.6;
    const nn=fbm(x/TS,y/TS,seed);
    let R,G,B;
    if(mm<o.mortar){
      const k=.7+.6*nn; R=o.mort[0]*k;G=o.mort[1]*k;B=o.mort[2]*k;
    }else{
      const A=o.a,Bc=o.b;
      R=A[0]+(Bc[0]-A[0])*id;G=A[1]+(Bc[1]-A[1])*id;B=A[2]+(Bc[2]-A[2])*id;
      let L=.72+nn*.7+(hash2(x,y,seed+3)-.5)*.16+(id-.5)*.2;
      const tl=Math.min(dl,dt)-o.mortar, br=Math.min(dr,db)-o.mortar;
      if(tl<4)L+=.3*(1-tl/4);
      if(br<5)L-=.4*(1-br/5);
      R*=L;G*=L;B*=L;
    }
    if(o.moss){
      const val=fbm(x/TS,y/TS,seed+77)+(y/TS-.5)*.35;
      const thr=.74-o.moss;
      if(val>thr){const a=Math.min(1,(val-thr)*7)*.85, k=.6+nn*.7;
        R=R*(1-a)+58*k*a;G=G*(1-a)+90*k*a;B=B*(1-a)+36*k*a;}
    }
    if(!o.flat){ // soot at top, damp grime at the bottom
      const yy=y/TS; let k=1; if(yy>.78)k=1-(yy-.78)*1.3; if(yy<.12)k*=.8+yy*1.6;
      R*=k;G*=k;B*=k;
    }
    const i=(y*TS+x)*4; d[i]=R;d[i+1]=G;d[i+2]=B;d[i+3]=255;
  }
  // cracks
  for(let k=0;k<(o.cracks||0);k++){
    let px=hash2(k,1,seed)*TS, py=hash2(k,2,seed)*TS*.8, ang=1.2+hash2(k,3,seed)*.8;
    for(let s=0;s<34;s++){
      ang+=(hash2(k,s+9,seed)-.5)*.9; px+=Math.cos(ang)*1.7; py+=Math.sin(ang)*1.7;
      for(let ox=-1;ox<=1;ox++){
        const xi=(((px+ox)|0)%TS+TS)%TS, yi=clamp(py|0,0,TS-1), i=(yi*TS+xi)*4;
        const f=ox===0?.45:.75; d[i]*=f;d[i+1]*=f;d[i+2]*=f;
      }
    }
  }
  return d;
}
function toCanvas(d){const c=document.createElement('canvas');c.width=c.height=TS;c.getContext('2d').putImageData(new ImageData(new Uint8ClampedArray(d),TS,TS),0,0);return c}
function warpTex(d,seed,amp){
  amp*=.5;
  const o=new Uint8ClampedArray(d.length);
  for(let y=0;y<TS;y++)for(let x=0;x<TS;x++){
    const nx=(fbm(x/TS,y/TS,seed)-.5)*2*amp,ny=(fbm(x/TS+.37,y/TS+.61,seed+50)-.5)*2*amp;
    const sx=(((Math.round(x+nx))%TS)+TS)%TS,sy=(((Math.round(y+ny))%TS)+TS)%TS,si=(sy*TS+sx)*4,di=(y*TS+x)*4;
    o[di]=d[si];o[di+1]=d[si+1];o[di+2]=d[si+2];o[di+3]=d[si+3];
  }
  return o;
}
function pix(c){return c.getContext('2d').getImageData(0,0,TS,TS).data}
function rrect(x,X,Y,W,H,r){
  // hand-cut, slightly wobbly outline (deterministic, so it never flickers)
  const sd=(X*13+Y*29+W*7+H*3)|0,J=(W<44||H<44)?.2:.4,pts=[];
  const jt=(k,i,m)=>(hash2(sd,k*131+i,m)-.5)*2*J;
  const edge=(x0,y0,x1,y1,k)=>{const n=Math.max(1,Math.round(Math.hypot(x1-x0,y1-y0)/7));for(let i=0;i<n;i++){const t=i/n;pts.push([x0+(x1-x0)*t+jt(k,i,1),y0+(y1-y0)*t+jt(k,i,2)])}};
  const cj=k=>1+hash2(sd,k,3)*.72; // chipped corners
  edge(X+r,Y,X+W-r,Y,1);pts.push([X+W-r*.25*cj(1),Y+r*.25*cj(1)]);
  edge(X+W,Y+r,X+W,Y+H-r,2);pts.push([X+W-r*.25*cj(2),Y+H-r*.25*cj(2)]);
  edge(X+W-r,Y+H,X+r,Y+H,3);pts.push([X+r*.25*cj(3),Y+H-r*.25*cj(3)]);
  edge(X,Y+H-r,X,Y+r,4);pts.push([X+r*.25*cj(4),Y+r*.25*cj(4)]);
  x.beginPath();x.moveTo(pts[0][0],pts[0][1]);for(let i=1;i<pts.length;i++)x.lineTo(pts[i][0],pts[i][1]);x.closePath();
}
function roughStrokeRect(x,y,w,h){rrect(ctx,x,y,w,h,1.2);ctx.stroke()}
function wornEdge(x,y,w,h,r){ // worn-away patches along a brass border
  const sd=(x*7+y*11+w*3+h)|0;ctx.save();
  ctx.setLineDash([3+hash2(sd,1,1)*12,2+hash2(sd,2,1)*3,6+hash2(sd,3,1)*16,1.5+hash2(sd,4,1)*3]);ctx.lineDashOffset=hash2(sd,5,1)*30;
  ctx.strokeStyle='rgba(16,11,6,.62)';ctx.lineWidth=1.7;rrect(ctx,x,y,w,h,r);ctx.stroke();ctx.restore();
}
// weathering for item and prop art: wobbly chipped edges, grime, scratches and rust
function wornSprite(c,seed,amp,heavy){
  const w=c.width,h=c.height,x=c.getContext('2d'),S=x.getImageData(0,0,w,h).data,dst=x.createImageData(w,h),D=dst.data;
  amp=(amp||1.5)*.45;
  for(let y=0;y<h;y++)for(let i=0;i<w;i++){
    const n1=(vnoise(i/5,y/5,64,seed)-.5)*2*amp,n2=(vnoise(i/5+23,y/5+11,64,seed+7)-.5)*2*amp;
    const sx=Math.min(w-1,Math.max(0,Math.round(i+n1))),sy=Math.min(h-1,Math.max(0,Math.round(y+n2)));
    const si=(sy*w+sx)*4,di=(y*w+i)*4;let a=S[si+3];
    if(a>0){
      const edge=sx<=0||sy<=0||sx>=w-1||sy>=h-1||S[((sy-1)*w+sx)*4+3]<40||S[((sy+1)*w+sx)*4+3]<40||S[(sy*w+sx-1)*4+3]<40||S[(sy*w+sx+1)*4+3]<40;
      if(edge&&hash2(i,y,seed+5)<.3)a=0;
      const g=.62+.55*vnoise(i/2.5,y/2.5,64,seed+3),lum=S[si]*.3+S[si+1]*.59+S[si+2]*.11,k=g*(edge?.78:1);
      D[di]=(S[si]*.72+lum*.28)*k;D[di+1]=(S[si+1]*.72+lum*.28)*k;D[di+2]=(S[si+2]*.72+lum*.28)*k*.96;
    }
    D[di+3]=a;
  }
  x.putImageData(dst,0,0);
  x.save();x.globalCompositeOperation='source-atop';
  for(let n=0;n<Math.floor(w*h/260);n++){const px=hash2(n,1,seed)*w,py=hash2(n,2,seed)*h,len=3+hash2(n,3,seed)*7,a=hash2(n,4,seed)*6.28;
    x.strokeStyle=hash2(n,5,seed)<.5?'rgba(220,214,190,.35)':'rgba(20,14,8,.45)';x.lineWidth=.7;x.beginPath();x.moveTo(px,py);x.lineTo(px+Math.cos(a)*len,py+Math.sin(a)*len);x.stroke()}
  for(let n=0;n<Math.floor(w*h/420);n++){const px=hash2(n,6,seed)*w,py=hash2(n,7,seed)*h,r=1+hash2(n,8,seed)*3;
    x.fillStyle=hash2(n,9,seed)<.5?'rgba(110,60,24,.35)':'rgba(14,10,6,.35)';x.beginPath();x.arc(px,py,r,0,TAU);x.fill()}
  if(heavy){ // old food: mottled, stained, patchy mould
    for(let n=0;n<Math.floor(w*h/70);n++){const px=hash2(n,11,seed)*w,py=hash2(n,12,seed)*h,r=.7+hash2(n,13,seed)*2.2;
      x.fillStyle=['rgba(60,40,18,.5)','rgba(90,110,60,.4)','rgba(20,14,8,.45)','rgba(180,150,100,.25)'][n%4];x.beginPath();x.arc(px,py,r,0,TAU);x.fill()}
  }
  x.restore();
}

const stoneOpts={rows:3,cols:r=>[2,3,2][r%3],stag:2,mortar:3,a:[124,118,108],b:[92,88,82],mort:[28,26,24],moss:.1,cracks:3};
const brickOpts={rows:8,cols:()=>4,stag:1,mortar:2,a:[142,66,48],b:[100,42,36],mort:[36,24,22],moss:0,cracks:4};
const TEX=[]; // {d,e}
function addTex(d,e){TEX.push({d,e:e||null});return TEX.length-1}

function archPath(x,w,top,bottom){
  x.beginPath();x.moveTo(w[0],bottom);x.lineTo(w[0],top+w[2]);x.arc((w[0]+w[1])/2,top+w[2],w[2],Math.PI,0);x.lineTo(w[1],bottom);x.closePath();
}
function doorTex(baseD,locked){
  const c=toCanvas(baseD),x=c.getContext('2d');
  const L=20,R=108,top=30,rad=44;
  // frame shadow
  x.save();x.lineWidth=6;x.strokeStyle='#15110d';archPath(x,[L-2,R+2,rad+2],top-2,128);x.stroke();x.restore();
  x.save();archPath(x,[L,R,rad],top,128);x.clip();
  // planks
  const n=5,pw=(R-L)/n;
  for(let i=0;i<n;i++){
    const g=x.createLinearGradient(L+i*pw,0,L+(i+1)*pw,0);
    const k=locked?.75:1, v=hash2(i,4,9);
    g.addColorStop(0,`rgb(${(70+v*18)*k|0},${(44+v*10)*k|0},${(24+v*6)*k|0})`);
    g.addColorStop(.5,`rgb(${(104+v*20)*k|0},${(68+v*12)*k|0},${(36+v*8)*k|0})`);
    g.addColorStop(1,`rgb(${(60+v*14)*k|0},${(38+v*8)*k|0},${(20+v*5)*k|0})`);
    x.fillStyle=g;x.fillRect(L+i*pw,0,pw+1,128);
    x.fillStyle='rgba(0,0,0,.55)';x.fillRect(L+i*pw,0,1.5,128);
  }
  for(let i=0;i<140;i++){ // grain
    const gx=L+hash2(i,1,3)*(R-L),gy=hash2(i,2,3)*128,gl=6+hash2(i,3,3)*18;
    x.strokeStyle=`rgba(${hash2(i,4,3)>.5?'30,16,6':'150,100,60'},${.12+hash2(i,5,3)*.18})`;x.lineWidth=1;
    x.beginPath();x.moveTo(gx,gy);x.lineTo(gx+(hash2(i,6,3)-.5)*2,gy+gl);x.stroke();
  }
  // iron bands
  const bands=locked?[56,92]:[60,98];
  for(const by of bands){
    const g=x.createLinearGradient(0,by,0,by+10);g.addColorStop(0,'#3a3836');g.addColorStop(.4,'#26241f');g.addColorStop(1,'#12100e');
    x.fillStyle=g;x.fillRect(L,by,R-L,10);
    x.fillStyle='rgba(255,255,255,.14)';x.fillRect(L,by,R-L,1.5);
    for(let rx=L+8;rx<R;rx+=17){x.fillStyle='#55524d';x.beginPath();x.arc(rx,by+5,2.2,0,TAU);x.fill();x.fillStyle='rgba(0,0,0,.5)';x.beginPath();x.arc(rx+.7,by+5.7,1.2,0,TAU);x.fill();}
  }
  if(locked){
    // heavy padlock plate
    x.fillStyle='#1a1816';rrect(x,50,66,28,30,4);x.fill();
    x.strokeStyle='#5a5650';x.lineWidth=2;rrect(x,50,66,28,30,4);x.stroke();
    x.fillStyle='#8a6a22';rrect(x,54,76,20,16,3);x.fill();
    x.strokeStyle='#b8902f';x.lineWidth=3;x.beginPath();x.arc(64,76,7,Math.PI,0);x.stroke();
    x.fillStyle='#120e08';x.beginPath();x.arc(64,83,2.6,0,TAU);x.fill();x.fillRect(63,83,2,6);
  }else{
    x.strokeStyle='#1d1b19';x.lineWidth=3.5;x.beginPath();x.arc(88,82,6.5,0,TAU);x.stroke();
    x.strokeStyle='#6a665f';x.lineWidth=1.2;x.beginPath();x.arc(88,82,6.5,Math.PI*1.1,Math.PI*1.7);x.stroke();
    x.fillStyle='#262421';x.beginPath();x.arc(88,75,3.5,0,TAU);x.fill();
  }
  // inner shadow
  const sg=x.createLinearGradient(L,0,R,0);sg.addColorStop(0,'rgba(0,0,0,.5)');sg.addColorStop(.12,'rgba(0,0,0,0)');sg.addColorStop(.88,'rgba(0,0,0,0)');sg.addColorStop(1,'rgba(0,0,0,.5)');
  x.fillStyle=sg;x.fillRect(L,0,R-L,128);
  x.restore();
  return pix(c);
}
function exitTex(baseD){
  const c=toCanvas(baseD),x=c.getContext('2d'),e=document.createElement('canvas');e.width=e.height=TS;const ex=e.getContext('2d');
  const L=22,R=106,top=26,rad=42;
  x.save();x.lineWidth=7;x.strokeStyle='#15110d';archPath(x,[L-2,R+2,rad+2],top-2,128);x.stroke();x.restore();
  for(const q of [x,ex]){
    q.save();archPath(q,[L,R,rad],top,128);q.clip();
    const g=q.createLinearGradient(0,top-rad,0,128);
    g.addColorStop(0,'#9fc4f0');g.addColorStop(.55,'#e8f1ff');g.addColorStop(1,'#fff6d8');
    q.fillStyle=g;q.fillRect(0,0,128,128);
    // stairs
    for(let i=0;i<7;i++){
      const y=128-i*9-8;
      q.fillStyle=i%2?'rgba(160,150,130,.95)':'rgba(190,180,160,.95)';q.fillRect(L+i*2,y,R-L-i*4,9);
      q.fillStyle='rgba(70,64,56,.9)';q.fillRect(L+i*2,y,R-L-i*4,1.5);
    }
    q.restore();
  }
  return {d:pix(c),e:pix(e)};
}
// a living flame: swaying, ragged tongues, white-hot core fading to red, redrawn for every frame
const FLAME_FRAMES=8,flameMemo={};
function flameRamp(I,red){
  const st=red?[[0,[96,8,6]],[.25,[200,26,14]],[.5,[255,96,70]],[.8,[255,200,170]],[1,[255,240,230]]]
              :[[0,[170,30,8]],[.25,[240,84,14]],[.5,[255,150,30]],[.8,[255,214,96]],[1,[255,250,214]]];
  for(let i=1;i<st.length;i++)if(I<=st[i][0]){const t=(I-st[i-1][0])/(st[i][0]-st[i-1][0]),p=st[i-1][1],q=st[i][1];return [p[0]+(q[0]-p[0])*t,p[1]+(q[1]-p[1])*t,p[2]+(q[2]-p[2])*t]}
  return st[st.length-1][1];
}
function flameEmissive(f,red){
  const key=f+(red?'r':'w');if(flameMemo[key])return flameMemo[key];
  const e=document.createElement('canvas');e.width=e.height=TS;const ex=e.getContext('2d');
  const rg=ex.createRadialGradient(64,56,2,64,50,38);rg.addColorStop(0,red?'rgba(255,60,30,.5)':'rgba(255,160,50,.46)');rg.addColorStop(1,red?'rgba(255,40,20,0)':'rgba(255,110,30,0)');
  ex.fillStyle=rg;ex.fillRect(0,0,TS,TS);
  const id=ex.getImageData(0,0,TS,TS),D=id.data,seed=red?91:47,ph=hash2(f,3,seed)*6;
  for(let j=0;j<0;j++)for(let i=30;i<98;i++){
    const v=(68-j)/52;if(v>1.02)continue;
    const vv=Math.max(0,v);
    const sway=Math.sin(f*.8+vv*3.4)*3.4*vv+(vnoise(i/7+f*.35,j/7-f*1.9,64,seed)-.5)*8*vv;
    const half=21*Math.pow(1-vv,.6)*(1+.4*Math.sin(vv*8-f*1.5+ph))*(v<0?.55+v*3:1);
    const d=Math.abs(i-64-sway)/Math.max(.5,half);
    let I=Math.pow(Math.max(0,1-d),.6)*Math.pow(Math.max(0,1-vv*vv),.8);
    I*=.74+.5*vnoise(i/3,j/3-f*2.4,64,seed+5);
    I=Math.max(0,Math.min(1,I));if(I<.03)continue;
    const [r,g,b]=flameRamp(I,red),k=(j*TS+i)*4,al=Math.min(255,I*310);
    D[k]=Math.max(D[k],r);D[k+1]=Math.max(D[k+1],g);D[k+2]=Math.max(D[k+2],b);D[k+3]=Math.max(D[k+3],al);
  }
  ex.putImageData(id,0,0);
  return flameMemo[key]=e;
}
let FLAMES=[],GLOWS=[];
function makeFlames(){
  for(const red of [false,true]){
    for(let f=0;f<FLAME_FRAMES;f++){
      const c=document.createElement('canvas');c.width=64;c.height=96;
      const x=c.getContext('2d'),id=x.createImageData(64,96),D=id.data,seed=red?91:47,ph=hash2(f,3,seed)*6;
      for(let j=0;j<96;j++)for(let i=0;i<64;i++){
        const v=(90-j)/82;if(v>1.02||v<-.08)continue;
        const vv=Math.max(0,v);
        const sway=Math.sin(f*.8+vv*3.4)*5*vv+(vnoise(i/9+f*.35,j/9-f*1.9,64,seed)-.5)*12*vv;
        const half=26*Math.pow(1-vv,.6)*(1+.4*Math.sin(vv*8-f*1.5+ph))*(v<0?.6+v*4:1);
        const d=Math.abs(i-32-sway)/Math.max(.5,half);
        let I=Math.pow(Math.max(0,1-d),.6)*Math.pow(Math.max(0,1-vv*vv),.8);
        I*=.74+.5*vnoise(i/4,j/4-f*2.4,64,seed+5);I=Math.max(0,Math.min(1,I));if(I<.03)continue;
        const [r,g,b]=flameRamp(I,red),k=(j*64+i)*4;D[k]=r;D[k+1]=g;D[k+2]=b;D[k+3]=Math.min(255,I*330);

   AUDIO (tiny synth)

let AC=null,MASTER=null,NB=null;
function audioInit(){
  if(AC)return;
  try{
    AC=new (window.AudioContext||window.webkitAudioContext)();MASTER=AC.createGain();MASTER.gain.value=.55;MASTER.connect(AC.destination);
    const len=AC.sampleRate;NB=AC.createBuffer(1,len,AC.sampleRate);const d=NB.getChannelData(0);for(let i=0;i<len;i++)d[i]=Math.random()*2-1;
    drone();
  }catch(e){AC=null}
}
function drone(){
  const g=AC.createGain();g.gain.value=0;g.connect(MASTER);
  g.gain.linearRampToValueAtTime(.05,AC.currentTime+6);
  for(const [f,dt] of [[55,0],[82.6,4],[110.4,-5],[164.9,3]]){
    const o=AC.createOscillator();o.type='sine';o.frequency.value=f;o.detune.value=dt;
    const og=AC.createGain();og.gain.value=f>100?.35:1;
    const l=AC.createOscillator();l.frequency.value=.05+Math.random()*.08;const lg=AC.createGain();lg.gain.value=.4;l.connect(lg);lg.connect(og.gain);
    o.connect(og);og.connect(g);o.start();l.start();
  }
}
function tone(f0,f1,dur,type,vol,delay){
  if(!AC||G.mute)return;const t=AC.currentTime+(delay||0),o=AC.createOscillator(),g=AC.createGain();
  o.type=type||'sine';o.frequency.setValueAtTime(f0,t);if(f1&&f1!==f0)o.frequency.exponentialRampToValueAtTime(f1,t+dur);
  g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol,t+Math.min(.015,dur/3));g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  o.connect(g);g.connect(MASTER);o.start(t);o.stop(t+dur+.05);
}
function nz(dur,vol,type,f0,f1,delay){
  if(!AC||G.mute)return;const t=AC.currentTime+(delay||0),s=AC.createBufferSource(),f=AC.createBiquadFilter(),g=AC.createGain();
  s.buffer=NB;s.loop=true;f.type=type;f.frequency.setValueAtTime(f0,t);if(f1)f.frequency.exponentialRampToValueAtTime(f1,t+dur);f.Q.value=1.2;
  g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol,t+.01);g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  s.connect(f);f.connect(g);g.connect(MASTER);s.start(t);s.stop(t+dur+.05);
}
function sfx(n){
  if(!AC||G.mute)return;
  switch(n){
    case 'step':nz(.1,.22,'lowpass',380,120);tone(70,45,.1,'sine',.18);break;
    case 'turn':nz(.14,.1,'lowpass',500,200);break;
    case 'bump':tone(90,50,.12,'triangle',.25);break;
    case 'hit':nz(.14,.35,'bandpass',900,300);tone(150,60,.14,'triangle',.3);break;
    case 'miss':nz(.16,.16,'highpass',1800,5000);break;
    case 'squeak':tone(1900,2800,.09,'triangle',.12);tone(2300,1700,.1,'triangle',.1,.1);break;
    case 'ratdie':tone(2400,500,.32,'triangle',.18);nz(.12,.2,'bandpass',700,200);break;
    case 'bite':nz(.1,.3,'bandpass',1400,500);tone(110,70,.12,'sawtooth',.18);break;
    case 'hurt':tone(120,60,.2,'sawtooth',.2);nz(.15,.2,'lowpass',600,150);break;
    case 'door':tone(80,150,.5,'sawtooth',.14);tone(83,140,.5,'sawtooth',.1);nz(.5,.12,'bandpass',400,900);break;
    case 'locked':tone(220,200,.08,'square',.1);tone(180,160,.1,'square',.1,.1);break;
    case 'key':tone(1500,1500,.3,'sine',.15);tone(2000,2000,.35,'sine',.12,.07);break;
    case 'potion':tone(500,900,.25,'sine',.14);tone(700,1200,.3,'sine',.1,.1);break;
    case 'heal':[523,659,784,1046].forEach((f,i)=>tone(f,f,.5,'sine',.12,i*.09));break;
    case 'fire':nz(.45,.3,'bandpass',3000,300);tone(400,90,.4,'sawtooth',.14);break;
    case 'arrow':nz(.18,.2,'highpass',2200,5200);tone(900,300,.12,'triangle',.08,.12);break;
    case 'growl':tone(95,55,.5,'sawtooth',.14);tone(120,70,.45,'sawtooth',.08,.1);nz(.4,.12,'lowpass',500,200);break;
    case 'rattle':for(let i=0;i<4;i++)nz(.05,.25,'bandpass',2600+i*300,1200,i*.06);tone(180,120,.2,'square',.05);break;
    case 'screech':tone(3400,1600,.18,'sawtooth',.07);tone(2800,3600,.12,'triangle',.08,.08);break;
    case 'equip':nz(.08,.22,'bandpass',1800,900);tone(260,200,.08,'square',.06);break;
    case 'level':[523,659,784,1046,1318].forEach((f,i)=>tone(f,f,.45,'triangle',.12,i*.1));break;
    case 'win':[392,523,659,784,1046].forEach((f,i)=>tone(f,f,.9,'triangle',.12,i*.18));break;
    case 'lose':[330,277,233,196].forEach((f,i)=>tone(f,f*.97,.9,'triangle',.14,i*.3));break;

function camSettled(){const C=G.C,P=G.P;return Math.abs(C.x-P.x)<.02&&Math.abs(C.y-P.y)<.02&&Math.abs(C.a-P.angT)<.02}

function hasLOS(ax,ay,bx,by){
  const dx=bx-ax,dy=by-ay,n=Math.ceil(Math.max(Math.abs(dx),Math.abs(dy))*5);
  for(let i=1;i<n;i++){const x=Math.floor(ax+.5+dx*i/n),y=Math.floor(ay+.5+dy*i/n);if(x<0||y<0||x>=MW||y>=MH||G.grid[y][x]>0)return false}
  return true;
}
/* enemy in the line straight ahead */
function frontEnemy(range){
  const d=DIRS[G.P.f];
  for(let k=1;k<=range;k++){
    const x=G.P.x+d[0]*k,y=G.P.y+d[1]*k;
    if(cellBlocked(x,y))return null;
    const e=enemyAt(x,y);if(e)return {e,k};
  }
  return null;
}
function bfs(e){
  const dist=new Int16Array(MW*MH).fill(-1),first=new Int16Array(MW*MH).fill(-1);
  const q=[[e.x,e.y]];dist[e.y*MW+e.x]=0;
  const occupied=new Set(G.enemies.filter(o=>o!==e&&o.hp>0).map(o=>o.y*MW+o.x));
  while(q.length){
    const [x,y]=q.shift(),dd=dist[y*MW+x];
    if(x===G.P.x&&y===G.P.y)return {dist:dd,step:first[y*MW+x]};
    if(dd>14)continue;
    for(let k=0;k<4;k++){
      const nx=x+DIRS[k][0],ny=y+DIRS[k][1],ni=ny*MW+nx;
      if(nx<0||ny<0||nx>=MW||ny>=MH||dist[ni]>=0)continue;
      const isP=nx===G.P.x&&ny===G.P.y;
      if(!isP&&(cellBlocked(nx,ny)||occupied.has(ni)))continue;
      dist[ni]=dd+1;first[ni]=dd===0?ny*MW+nx:first[y*MW+x];q.push([nx,ny]);
    }
  }
  return null;
}

/* ---------- bag and equipment ---------- */
function bagAdd(it){
  const d=idef(it);
  if(d.stack){const s=G.bag.find(b=>b.id===it.id);if(s){s.n+=it.n||1;return true}}
  if(G.bag.length>=BAGCAP)return false;
  G.bag.push(it);return true;
}
function bagTake(i){const it=G.bag[i];if(it.n>1){it.n--;return {id:it.id,n:1}}G.bag.splice(i,1);return it}
const countPotions=()=>G.bag.reduce((a,b)=>a+(b.id==='potion'?b.n:0),0);
function slotFits(slot,d,hi){
  switch(slot){
    case 'head':return d.k==='head';case 'chest':return d.k==='chest';case 'arms':return d.k==='arms';case 'legs':return d.k==='legs';
    case 'main':return d.k==='weapon'||d.k==='light';
    case 'off':return d.k==='weapon'||d.k==='shield'||d.k==='light';
    case 'alt':return d.k==='weapon';
  }
  if(slot[0]==='r')return d.k==='ring';
  if(slot[0]==='s')return d.k==='spell'&&HERO_DEF[hi].caster;
  return false;
}
function reqFail(h,d){const r=d.req||{};if((r.str||0)>h.str)return 'STR '+r.str;if((r.dex||0)>h.dex)return 'DEX '+r.dex;if((r.int||0)>h.int)return 'INT '+r.int;return null}
function recalcMax(hi){
  const h=G.heroes[hi];let b=h.base;
  for(const k in h.eq)b+=idef(h.eq[k]).hp||0;
  const delta=b-h.max;h.max=b;if(delta>0)h.hp+=delta;if(h.hp>h.max)h.hp=h.max;
}
function equipTo(hi,slot,bagIdx){
  const h=G.heroes[hi],it=G.bag[bagIdx];if(!it)return false;const d=idef(it);
  if(!slotFits(slot,d,hi)){msg(slot[0]==='s'&&d.k==='spell'?'Only the mage can use spell scrolls.':'That does not fit there.','#d09a80');return false}
  const rf=reqFail(h,d);if(rf){msg(`${HERO_DEF[hi].name} needs ${rf} to use the ${d.n}.`,'#d09a80');return false}
  const old=h.eq[slot],taken=bagTake(bagIdx);
  if(old&&!bagAdd(old)){G.bag.splice(bagIdx,0,taken);msg('Your bag is full.','#d09a80');return false}
  h.eq[slot]=taken;recalcMax(hi);sfx('equip');msg(`${HERO_DEF[hi].name} equips the ${d.n}.`);return true;
}
function unequip(hi,slot){
  const h=G.heroes[hi],it=h.eq[slot];if(!it)return false;
  if(!bagAdd(it)){msg('Your bag is full.','#d09a80');return false}
  delete h.eq[slot];recalcMax(hi);sfx('equip');return true;
}
function autoSlot(hi,d){
  const h=G.heroes[hi];
  switch(d.k){
    case 'head':return 'head';case 'chest':return 'chest';case 'arms':return 'arms';case 'legs':return 'legs';case 'shield':return 'off';
    case 'weapon':return !h.eq.main?'main':!h.eq.alt?'alt':'main';
    case 'light':return !h.eq.off?'off':!h.eq.main?'main':'off';
    case 'ring':return RING_SLOTS.find(s=>!h.eq[s])||'r0';

/* swap a hand slot with the main hand (the small HUD windows) */
function swapHand(hi,slot){

  if(a&&!slotFits(slot,idef(a),hi)){msg(`The ${idef(a).n} does not fit in the ${SLOT_LABEL[slot].toLowerCase()} slot.`,'#d09a80');return false}
  if(b)h.eq.main=b;else delete h.eq.main;

const strB=h=>Math.floor(Math.max(0,h.str-8)/4);

function heroWeapon(h){const it=h.eq.main;return it&&idef(it).k==='weapon'?idef(it):null}
function ringSum(h,key){let s=0;for(const k of RING_SLOTS)if(h.eq[k])s+=idef(h.eq[k])[key]||0;return s}
function heroArmor(h){let a=0;for(const k of ['head','arms','legs','chest','off',...RING_SLOTS]){const it=h.eq[k];if(it)a+=idef(it).armor||0}return a}
function heroDmgRange(h){const w=heroWeapon(h),r=w?w.dmg:(h.unarmed||[1,2]),b=strB(h)+ringSum(h,'dmgb');return [r[0]+b,r[1]+b]}

function magicBonus(h){let m=0;for(const k of ['main','off','alt']){const it=h.eq[k];if(it)m+=idef(it).magic||0}return m}
function heroLight(h){let l=0;for(const k of ['main','off']){const it=h.eq[k];if(it&&idef(it).k==='light')l=Math.max(l,idef(it).light)}return l}

  if(Math.random()<(w&&w.dbl||0)+ringSum(h,'dbl')){d*=2;crit=true}
  return {d:Math.max(1,Math.round(d*(mult||1))),crit};

/* ---------- experience ---------- */
function giveXP(amount){
  for(const hi of livingHeroes()){
    const h=G.heroes[hi];h.xp+=amount;
    while(h.xp>=xpNeed(h.lvl))levelUp(hi);

}
function levelUp(hi){
  const h=G.heroes[hi],def=HERO_DEF[hi],g=def.grow;
  h.xp-=xpNeed(h.lvl);h.lvl++;h.base+=g.hp;h.mpMax+=g.mp;h[g.a]++;if(h.lvl%2===0)h[g.b]++;
  recalcMax(hi);h.hp=Math.min(h.max,h.hp+Math.ceil(g.hp*1.5));h.mp=h.mpMax;h.lvlFlash=1.6;

function hurtEnemy(e,dmg){

  if(e.hp<=0){
    e.dying=.55;G.kills++;sfx(e.t==='skel'?'rattle':'ratdie');

function enemyAct(e){
  const def=ENEMY_DEF[e.t],dist=()=>Math.abs(e.x-G.P.x)+Math.abs(e.y-G.P.y);

function doMove(rel){ // rel: 0 forward, 1 right, 2 back, 3 left
  const dir=DIRS[(G.P.f+rel)%4],nx=G.P.x+dir[0],ny=G.P.y+dir[1];
  if(nx<0||ny<0||nx>=MW||ny>=MH){sfx('bump');return}
  const g=G.grid[ny][nx];
  if(g===3){G.grid[ny][nx]=0;sfx('door');msg('You push the door open.');later(260,endRound);return}
  if(g===4){
    if(G.keys>0){G.keys--;G.grid[ny][nx]=0;sfx('door');msg('The rusty key turns. The door groans open.','#ffd76a');later(300,endRound)}

  }
  if(g===5||g===7){exitLevel(g);return}
  if(g===8){sfx('locked');msg('The crypt door has sealed behind you.','#d09a80');return}
  if(g>=15&&g<=17){sfx('locked');const ms=DOOR_MSGS[g];msg(ms[(hash2(nx,ny,3)*ms.length)|0],'#d09a80');return}
  if(g>=20){usePortal(g-20);return}
  if(g===0){const dc=G.decor.find(d=>d.loot&&d.x===nx&&d.y===ny);if(dc){openLoot(dc);return}
    const nd=G.decor.find(d=>d.npc&&d.x===nx&&d.y===ny);if(nd){startTalk(nd);return}}
  if(g>0||G.decor.some(d=>d.block&&d.x===nx&&d.y===ny)){sfx('bump');G.shake=.12;return}
  const e=enemyAt(nx,ny);

/* tap an object in the 3D view: floor items and wall torches */
function viewTap(x,y){
  if(G.state!=='play'||G.menu||G.map||G.inv.open||G.loot)return;
  const hits=G.hits.slice().sort((a,b)=>a.ty-b.ty);
  for(const h of hits){
    if(h.type==='decor'){
      if(x<h.x0||x>h.x1||y<h.y0||y>h.y1)continue;
      if(h.ty>(h.ref.npc?2.6:1.9)){msg('Too far away. Step closer.','#d09a80');return}
      if(h.ref.npc)startTalk(h.ref);else openLoot(h.ref);return;
    }
    if(h.type==='item'){
      if(x<h.x0||x>h.x1||y<h.y0||y>h.y1)continue;
      if(h.ty>1.9){msg('Too far away. Step closer.','#d09a80');return}
      pickup(h.ref);return;
    }
    if(Math.hypot(x-h.sx,y-h.sy)>h.r)continue;
    if(h.ty>2.8){msg('That torch is too far away. Walk closer.','#d09a80');return}
    takeTorch(h.L);return;
  }
}
function act(id){
  if(G.state==='title'){audioInit();crInit();G.state='create';return}
  if(G.state!=='play')return;
  if(!canAct()){if(['fwd','back','left','right','turnL','turnR'].includes(id))G.queued=id;return}
  G.queued=null;
  const i=G.sel;
  switch(id){
    case 'fwd':doMove(0);break;case 'right':doMove(1);break;case 'back':doMove(2);break;case 'left':doMove(3);break;
    case 'turnL':doTurn(-1);break;case 'turnR':doTurn(1);break;
    case 'attack':if(G.heroes[i].alive&&heroAttack(i))heroDone(i);break;
    case 'special':if(G.heroes[i].alive&&heroSpecial(i))heroDone(i);break;
    case 'potion':if(G.heroes[i].alive&&usePotion(i))heroDone(i);break;
    case 'swapoff':case 'swapalt':if(G.heroes[i].alive&&swapHand(i,id==='swapoff'?'off':'alt')&&hostileNear()&&!G.acted[i])heroDone(i);break;
    case 'wait':msg('The party waits.','#a09880');endRound();break;

  }
}


/* ==========================================================================
   3D RENDERER

const VW=420,VH=210,HH=VH/2,PL=.75,F=(VW/2)/PL,EYE=.5,AMB=.018;
let RANGE=5.2;

const LUT=new Float32Array(1025);for(let i=0;i<=1024;i++){const t=1-i/1024;LUT[i]=AMB+(t>0?.5*Math.pow(t,1.8):0)}

}
function render3D(){
  const t=G.time,C=G.C,dX=Math.cos(C.a),dY=Math.sin(C.a),pX=-dY*PL,pY=dX*PL;

  for(const L of LIGHTS){if(L.taken)continue;const d2=(L.x-cx)**2+(L.y-cy)**2;if(d2<100){

    else L._h=null}
  const nl=nearL,nn=nl.length,nr=nearR,nrn=nr.length;
  const D=vimg.data;
  const day=G.day||0,lbm=Math.max(day,G.amb||0),fd=G.fl||(day?GRASSD:FLOORD),cd=G.cl||(day?SKYD:CEILD);
  const hzr=day?[132,146,132]:[86,76,62],hzc=day?[110,124,112]:[69,61,50],hzmax=day?.55:.32,hzrate=day?.07:.042;
  const tbR=1,tbG=.94,tbB=.84, ttR=1.3,ttG=.88,ttB=.5;
  // floor + ceiling
  for(let y=HH;y<VH;y++){
    const p=y-HH+.5,rd=EYE*F/p;

    const sx=rd*2*pX/VW,sy=rd*2*pY/VW;

      const cxl=Math.floor(fx),cyl=Math.floor(fy);

      let lr=0,lrc=0;
      for(let k=0;k<nrn;k+=3){const ax=fx-nr[k],ay=fy-nr[k+1],d2=ax*ax+ay*ay;lr+=nr[k+2]/(1+1.15*(d2+.44));lrc+=nr[k+2]/(1+1.15*(d2+.12))}
      const kR=(lb*tbR+lt*ttR+lr*1.4)*vg,kG=(lb*tbG+lt*ttG+lr*.2)*vg,kB=(lb*tbB+lt*ttB+lr*.1)*vg;

      D[io]=fd[ti]*kR*iv+hzr[0]*sk;D[io+1]=fd[ti+1]*kG*iv+hzr[1]*sk;D[io+2]=fd[ti+2]*kB*iv+hzr[2]*sk;
      D[ic]=cd[ti]*kRc*cs*iv+hzc[0]*sk;D[ic+1]=cd[ti+1]*kGc*cs*iv+hzc[1]*sk;D[ic+2]=cd[ti+2]*kBc*cs*iv+hzc[2]*sk;
    }
  }

  for(let x=0;x<VW;x++){

function spriteList(){

  }

function drawSprites(cx,cy,dX,dY,pX,pY){
  const inv=-1/PL,list=spriteList(),proj=[];
  for(const s of list){
    const rx=s.x-cx,ry=s.y-cy;
    const tX=inv*(dY*rx-dX*ry),tY=inv*(-pY*rx+pX*ry);
    if(tY<.25)continue;

  }

    const img=s.img;if(!img)continue;
    const iw=img.width,ih=img.height,ty=s.tY;
    let sw=F*s.w/ty;sw*=(1+(s.lunge||0)*.28);
    const sh=sw*ih/iw*(1-(s.sink||0)*.6);
    const scrX=VW/2*(1+s.tX/ty)+(s.flash>0?Math.sin(G.time*60)*2.5*s.flash:0);
    const bottom=HH+EYE*F/ty-(s.bob||0)*F/ty+(s.sink||0)*sh*.25;
    const left=scrX-sw/2,top=bottom-sh;
    if(s.e){s.e.sx=scrX;s.e.sy=top+sh*.45}
    {const xa=Math.max(0,Math.floor(left)),xb=Math.min(VW-1,Math.ceil(left+sw));if(xb<xa||ty>16)continue;let any=false;for(let xx=xa;xx<=xb;xx+=2)if(zbuf[xx]>ty){any=true;break}if(!any)continue} // skip hidden sprites
    let anyVis=false;
    // lighting
    const wx=s.x,wy=s.y,dist=Math.hypot(wx-cx,wy-cy);
    let lt=0;for(let k=0;k<nearL.length;k+=3){const ax=wx-nearL[k],ay=wy-nearL[k+1];lt+=nearL[k+2]/(1+1.15*(ax*ax+ay*ay))}
    for(let k=0;k<nearR.length;k+=3){const ax=wx-nearR[k],ay=wy-nearR[k+1];lt+=nearR[k+2]/(1+1.15*(ax*ax+ay*ay))}
    const lum=clamp(.08+(Math.max(baseL(dist),G.day||0,G.amb||0)+lt*.85)*1.05,0,1);
    tmpX.clearRect(0,0,iw,ih);tmpX.globalCompositeOperation='source-over';tmpX.globalAlpha=1;

    if(s.flash>0){tmpX.fillStyle=`rgba(255,70,40,${(s.flash*.55).toFixed(3)})`;tmpX.fillRect(0,0,iw,ih)}

    for(let x=x0;x<=x1;x++){
      const vis=x<x1&&zbuf[x]>ty;
      if(vis&&run<0)run=x;
      if(vis)anyVis=true;
      if((!vis||x===x1)&&run>=0){
        const u0=(run-left)/sw*iw,u1=(x-left)/sw*iw;
        vctx.drawImage(tmpC,u0,0,Math.max(.5,u1-u0),ih,run,top,x-run,sh);

    }
    vctx.globalAlpha=1;
    if(anyVis){
      if(s.decor&&(s.decor.loot||s.decor.npc))G.hits.push({type:'decor',ref:s.decor,x0:left,x1:left+sw,y0:top,y1:bottom,ty});

    }
  }
}

const LIGHT_ZONES=[
  [7,17,10,19,2.0,0],   // the armoury: bright
  [13,13,19,19,15,1],   // the skeleton crypt: the one dark room (a faint red glow at most)
  [21,11,26,19,2.4,1],  // the Rat King's lair: red
  [1,15,5,19,2.6,0],    // start crypt
  [1,5,8,9,2.8,0],      // rat hall
  [15,2,24,9,3.2,0],    // bat hall
  [3,10,3,14,3.6,0],[10,7,14,7,3.2,0],[11,3,13,5,3.0,0]];
function setupLights(){
  LIGHTS.length=0;torchAt.clear();
  if(G.day>0)return; // daylight: no wall torches outdoors
  const tg=(LEVELS[LEVEL]&&LEVELS[LEVEL].torchGap)||6.2,zoneAt=(x,y)=>{if(LEVEL===1)for(const z of LIGHT_ZONES)if(x>=z[0]&&x<=z[2]&&y>=z[1]&&y<=z[3])return z;return [0,0,0,0,tg,0]};
  const cands=[];
  for(let y=1;y<MH-1;y++)for(let x=1;x<MW-1;x++){
    const g=G.grid[y][x];if(g!==1&&g!==2)continue;
    for(let f=0;f<4;f++){
      const nx=x+DIRS[f][0],ny=y+DIRS[f][1];
      if(G.grid[ny][nx]===0&&!G.decor.some(d=>d.block&&d.x===nx&&d.y===ny))cands.push([x,y,f,nx,ny]);
    }
  }
  cands.sort((a,b)=>hash2(a[0],a[1],a[2]*7+3)-hash2(b[0],b[1],b[2]*7+3));
  const out=[];
  for(const c of cands){const gap=zoneAt(c[3],c[4])[4];if(!out.some(t=>Math.hypot(t[0]-c[0],t[1]-c[1])<gap))out.push(c)}
  for(const [x,y,f,nx,ny] of out){
    const d=DIRS[f],key=(y*MW+x)*4+f,red=!!zoneAt(nx,ny)[5];
    torchAt.set(key,red?2:1);
    LIGHTS.push({x:x+.5+d[0]*.62,y:y+.5+d[1]*.62,ph:hash2(x,y,5)*6.28,key,taken:false,red});
  }
  if(G.extraLights)for(const [x,y] of G.extraLights)LIGHTS.push({x:x+.5,y:y+.5,ph:hash2(x,y,9)*6.28,key:-1-LIGHTS.length,taken:false,red:false,free:true});
}

  if(id.startsWith('ihero')){I.hero=+id.slice(5);I.sel=null;I.scroll=I.scroll;if(G.heroes[I.hero].alive)G.sel=I.hero;return}
  if(id.startsWith('itab_')){I.tab=id.slice(5);I.sel=null;return}
  if(id.startsWith('ibag')&&id!=='ibagarea'){const i=+id.slice(4);I.sel=(I.sel&&I.sel.src==='bag'&&I.sel.i===i)?null:(G.bag[i]?{src:'bag',i}:null);return}
  if(id.startsWith('islot_')){slotTap(id.slice(6));return}
  if(id==='iequip'){
    const it=selItem();if(!it||I.sel.src!=='bag')return;
    const slot=autoSlot(hi,idef(it));
    if(!slot){msg('Only the mage can use spell scrolls.','#d09a80');return}
    if(equipTo(hi,slot,I.sel.i))I.sel={src:'slot',slot};
    return;
  }
  if(id==='iunequip'){if(I.sel&&I.sel.src==='slot'&&unequip(hi,I.sel.slot))I.sel=null;return}
  if(id==='iuse'||id==='ipotion'){
    if(!h.alive){msg('The dead cannot drink.');return}
    if(useHeal(hi,id==='iuse'&&I.sel&&I.sel.src==='bag'?I.sel.i:-1)){
      I.sel=null;
      if(hostileNear()&&!G.acted[hi])heroDone(hi);
    }
    return;
  }
  if(id==='isort'){
    G.bag.sort((a,b)=>(KIND_ORDER[idef(a).k]-KIND_ORDER[idef(b).k])||idef(a).n.localeCompare(idef(b).n));I.sel=null;return;
  }
}

function illum(x,y,w,h,seed){
  const kind=Math.floor(hash2(seed,5,1)*3),right=hash2(seed,6,2)<.5;
  ctx.save();ctx.lineCap='round';ctx.lineJoin='round';
  const dir=right?-1:1,sx=right?x+w-5:x+5,sy=y+1.6;
  const ink='#3e301a',gold='#9a8644',leaf='#566c54',red='#82362e',blue='#38567e';
  if(kind===0){ // creeping vine with leaves and a berry
    ctx.strokeStyle=ink;ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(sx,sy);ctx.bezierCurveTo(sx+dir*7,sy-4,sx+dir*11,sy+3,sx+dir*18,sy);ctx.bezierCurveTo(sx+dir*24,sy-3,sx+dir*27,sy+3,sx+dir*32,sy);ctx.stroke();
    for(const t of [8,19,29]){ctx.fillStyle=leaf;ctx.beginPath();ctx.ellipse(sx+dir*t,sy+(t===19?-3:3),3.2,1.5,dir*.7,0,TAU);ctx.fill();ctx.strokeStyle=ink;ctx.lineWidth=.5;ctx.stroke()}
    ctx.fillStyle=red;ctx.beginPath();ctx.arc(sx+dir*14,sy+2.4,1.5,0,TAU);ctx.fill();ctx.fillStyle=gold;ctx.beginPath();ctx.arc(sx+dir*33,sy,1.3,0,TAU);ctx.fill();
  }else if(kind===1){ // interlaced knotwork
    for(let i=0;i<3;i++){ctx.strokeStyle=ink;ctx.lineWidth=2.4;ctx.beginPath();ctx.ellipse(sx+dir*(6+i*7),sy+1,4.5,2.6,i%2?.5:-.5,0,TAU);ctx.stroke();
      ctx.strokeStyle=gold;ctx.lineWidth=1.2;ctx.beginPath();ctx.ellipse(sx+dir*(6+i*7),sy+1,4.5,2.6,i%2?.5:-.5,0,TAU);ctx.stroke()}
    ctx.fillStyle=blue;ctx.beginPath();ctx.arc(sx,sy+1,1.4,0,TAU);ctx.fill();
  }else{ // a tiny wyrm
    ctx.strokeStyle=ink;ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(sx+dir*24,sy+2);ctx.bezierCurveTo(sx+dir*18,sy-3,sx+dir*12,sy+5,sx+dir*6,sy+1);ctx.bezierCurveTo(sx+dir*3,sy-1,sx+dir*1,sy,sx,sy-1);ctx.stroke();
    ctx.strokeStyle=leaf;ctx.lineWidth=1.8;ctx.beginPath();ctx.moveTo(sx+dir*24,sy+2);ctx.bezierCurveTo(sx+dir*18,sy-3,sx+dir*12,sy+5,sx+dir*6,sy+1);ctx.bezierCurveTo(sx+dir*3,sy-1,sx+dir*1,sy,sx,sy-1);ctx.stroke();
    ctx.fillStyle=leaf;ctx.beginPath();ctx.arc(sx,sy-1,2.2,0,TAU);ctx.fill();ctx.fillStyle=red;ctx.fillRect(sx-1,sy-2,1.2,1.2);
    ctx.strokeStyle=gold;ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(sx+dir*24,sy+2);ctx.lineTo(sx+dir*28,sy-1);ctx.stroke();
  }
  ctx.restore();
}

  ctx.strokeStyle='rgba(220,220,210,.35)';ctx.lineWidth=.45;ctx.beginPath();ctx.moveTo(9,-11);ctx.lineTo(5,-6);ctx.moveTo(9,-11);ctx.lineTo(10,-5);ctx.moveTo(9,-11);ctx.lineTo(2,-10);ctx.moveTo(7,-9);ctx.quadraticCurveTo(6,-7,8,-6);ctx.stroke();

function crBtn(id){
  const C=G.cr,cur=C.cur;C.note='';
  if(id.startsWith('cr_slot')){
    const i=+id.slice(7);C.slot=i;C.cur=C.party[i]?Object.assign({},C.party[i]):blankHero();C.step='look';
    if(C.party[i])C.page=Math.floor(C.party[i].app/8);return;
  }
  if(id==='cr_pgL'){C.page=(C.page+PAGES-1)%PAGES;return}
  if(id==='cr_pgR'){C.page=(C.page+1)%PAGES;return}
  if(id.startsWith('cr_app')){cur.app=+id.slice(6);if(cur.cls<0)C.step='job';return}
  if(id.startsWith('cr_cls')){const n=+id.slice(6);if(cur.cls!==n){cur.cls=n;cur.bs=cur.bd=cur.bi=0}return}
  if(id==='cr_ok'){
    if(C.step==='look'){if(cur.app>=0)C.step='job';else C.note='Choose an appearance first.'}
    else if(C.step==='job'){if(cur.cls>=0)C.step='stats';else C.note='Choose an occupation first.'}
    else if(C.step==='stats'){
      if(crFree(cur)>0){C.note='Distribute all the free points first.';return}
      if(!cur.name)cur.name=randName(cur.cls);
      C.party[C.slot]=Object.assign({},cur);
      const nx=C.party.findIndex(p=>!p);
      if(nx>=0){C.slot=nx;C.cur=blankHero();C.step='look'}else C.step='done';
    }
    return;
  }
  if(id==='cr_back'){if(C.step==='stats')C.step='job';else if(C.step==='job')C.step='look';return}
  if(id==='cr_start'){if(C.party.every(Boolean))startGame();else C.note='Create all four heroes first.';return}
  if(id==='cr_default'){C.party=DEFAULT_PARTY.map(p=>Object.assign({},p));C.slot=0;C.cur=Object.assign({},C.party[0]);C.step='done';return}
  if(id==='cr_rand'){cur.name=randName(cur.cls);return}
  if(id==='cr_name'){
    let n=null;try{n=prompt('Name this hero (12 letters at most):',cur.name||randName(cur.cls))}catch(e){}
    if(n&&n.trim())cur.name=n.trim().slice(0,12);return;
  }
  const m=id.match(/^cr_(bs|bd|bi)([+-])$/);
  if(m&&cur.cls>=0){
    if(m[2]==='+'){if(crFree(cur)>0)cur[m[1]]++}else if(cur[m[1]]>0)cur[m[1]]--;
  }
}

function foodFor(u){let t=FOOD_TABLE.reduce((a,f)=>a+f[1],0)*u;for(const [id,w] of FOOD_TABLE){t-=w;if(t<=0)return id}return 'apple'}
function lootFor(d){
  const r=k=>hash2(d.x,d.y,100+k),items=[];
  const add=(id,n)=>items.push({id,n:ITEMDEF[id].stack?(n||1):1});
  if(d.k==='barrel'){
    const n=1+Math.floor(r(1)*3);
    for(let k=0;k<n;k++){const p=r(2+k);add(p<.28?foodFor(r(30+k)):p<.5?'potion':'torch',1)}
    d.gold=3+Math.floor(r(20)*10);
  }else{
    d.gold=6+Math.floor(r(1)*14);
    if(r(2)<.4)add(['ringV','ringW','dagger','scrollLight'][Math.floor(r(3)*4)]);

  return items;

function titleBtn(id){
  audioInit();
  if(id==='tnew'){crInit();G.state='create'}
  else if(id==='tcont'){const sv=readSave('auto')||readSave('prev');if(sv)restore(sv)}
  else if(id==='tload')openSaves('title');

function savesBtn(id){
  const S=G.saves;
  if(id==='sv_close'){G.saves=null;return}
  const m=id.match(/^sv_(load|save|del)_(\w+)$/);if(!m)return;
  const [,what,k]=m;
  if(what!=='del')S.confirm=null;
  S.noteT=G.time;
  if(what==='save'){
    if(G.state!=='play'||G.timers.length){S.note='Wait for the round to finish, then save.';return}
    if(writeSave(k)){S.note='Game saved.';refreshSaves()}else S.note='Could not save: storage is full or blocked.';
    return;
  }
  if(what==='load'){
    const sv=readSave(k);if(!sv){S.note='That slot is empty.';return}
    if(G.state==='play'&&G.timers.length===0&&k!=='prev')writeSave('prev'); // so a mistaken load can be undone
    restore(sv);return;
  }
  if(S.confirm===k){try{localStorage.removeItem('abbeySave_'+k)}catch(e){}S.confirm=null;S.note='Erased.';refreshSaves()}
  else{S.confirm=k;S.note='Tap Erase again to confirm.'}
}

function storyTick(){

  if(!F.wolves1&&P.x>=17){F.wolves1=1;startCut('wolves1',()=>spawnWave(['wolf','wolf','wolf','wolf']))}
  else if(!F.cutB&&F.wolves1&&(F.wolfKills||0)>=4&&!wolvesAlive){F.cutB=1;startCut('banditsReveal',()=>spawnWave(['bandit','bandit','bandit','archer','archer']))}

}
function enemyShoot(e){
  const def=ENEMY_DEF[e.t],st=enemyStat(e.t),l=livingHeroes();if(!l.length)return;
  const pool=[];for(const j of l)for(let k=0;k<(j<2?3:1);k++)pool.push(j);
  const t=pool[rnd(0,pool.length-1)],h=G.heroes[t];e.lunge=1;
  G.arrows.push({x0:clamp(e.sx,14,406),y0:clamp(e.sy,40,170),x1:210+rnd(-30,30),y1:196,t:G.time});sfx('arrow');
  const hitC=clamp(def.hit-heroArmor(h)*.03,.12,.95);

    const d=rnd(st.dmg[0],st.dmg[1]);h.hp-=d;h.hurt=1;G.shake=.3;sfx('hurt');

  }else msg(`An arrow from the ${def.name} whistles past ${HERO_DEF[t].name}.`,'#a09880');
}
function drawArrows(){
  for(let i=G.arrows.length-1;i>=0;i--){
    const a=G.arrows[i],t=(G.time-a.t)/.42;if(t>=1){G.arrows.splice(i,1);continue}

    ctx.fillStyle='#b8c0cc';ctx.beginPath();ctx.moveTo(12,0);ctx.lineTo(6,-3);ctx.lineTo(6,3);ctx.closePath();ctx.fill();
    ctx.fillStyle='#8a6a40';ctx.fillRect(-18,-3,6,1.5);ctx.fillRect(-18,1.5,6,1.5);ctx.restore();
  }
}

function update(dt){
  G.time+=dt;
  if(G.dayBase>0){const hr=(G.clock%1440)/60;G.day=Math.max(.1,G.dayBase*clamp(.5+.62*Math.cos((hr-12)/24*TAU),.26,1))}
  // timers
  if(!G.cut)for(let i=0;i<G.timers.length;){const t=G.timers[i];if(G.time>=t.t){G.timers.splice(i,1);t.fn()}else i++}
  // camera easing
  const C=G.C,P=G.P;
  const mv=dt*5.2;C.x+=clamp(P.x-C.x,-mv,mv);C.y+=clamp(P.y-C.y,-mv,mv);
  const ma=dt*7.5;C.a+=clamp(P.angT-C.a,-ma,ma);
  // entity animation
  for(const e of G.enemies){
    const s=dt*3.6;e.rx+=clamp(e.x-e.rx,-s,s);e.ry+=clamp(e.y-e.ry,-s,s);
    if(e.flash>0)e.flash=Math.max(0,e.flash-dt*3.5);
    if(e.lunge>0)e.lunge=Math.max(0,e.lunge-dt*3.2);
    if(e.hp<=0&&e.dying>0)e.dying=Math.max(0,e.dying-dt);
  }
  for(const h of G.heroes){if(h.hurt>0)h.hurt=Math.max(0,h.hurt-dt*2.6);if(h.lvlFlash>0)h.lvlFlash=Math.max(0,h.lvlFlash-dt)}
  { // party light eases towards the best light being carried
    const target=Math.max(partyLight(),G.lightBoost>0?1.1:0);
    const prev=G.lightLevel;G.lightLevel+=clamp(target-prev,-dt*1.5,dt*1.5);
    if(Math.abs(G.lightLevel-(update._set||0))>.01){update._set=G.lightLevel;setLightLevel(G.lightLevel)}
  }
  if(G.shake>0)G.shake=Math.max(0,G.shake-dt*1.6);
  // held d-pad repeat, queued input
  if(G.hold&&G.time>=G.hold.t){act(G.hold.id);G.hold.t=G.time+.16}
  if(G.queued&&canAct()){const q=G.queued;G.queued=null;act(q)}
  if(G.state==='play'&&G.time>=G.nextAuto&&G.timers.length===0&&!G.drag&&!G.cut){G.nextAuto=G.time+6;writeSave('auto')}
}
const crtC=document.createElement('canvas');crtC.width=240;crtC.height=160;const crtX=crtC.getContext('2d');

function crtPass(t){

  ctx.save();ctx.setTransform(1,0,0,1,0,0);
  const W=cv.width,H=cv.height;
  crtX.drawImage(cv,0,0,240,160);                       // phosphor bloom
  ctx.globalCompositeOperation='screen';ctx.globalAlpha=.22;ctx.drawImage(crtC,0,0,W,H);
  ctx.globalAlpha=1;ctx.globalCompositeOperation='source-over';

  const by=((t*55)%(H+200))-100,g=ctx.createLinearGradient(0,by-60,0,by+60); // slow rolling band

  ctx.fillStyle=g;ctx.fillRect(0,by-60,W,120);

  ctx.fillStyle=`rgba(0,0,0,${(.03+.025*Math.sin(t*41)+.015*Math.sin(t*7.3)).toFixed(3)})`;ctx.fillRect(0,0,W,H); // flicker

}

}
function handleBtn(id){
  if(G.cut){cutAdvance();return}
  if(G.talk){talkBtn(id);return}
  if(G.overview){G.overview=false;return}
  if(G.saves){savesBtn(id);return}
  if(G.state==='title'){titleBtn(id);return}
  if(G.state==='create'){crBtn(id);return}
  if(G.state==='win'||G.state==='dead'){if(id==='restart'){backupAuto();reset();G.state='play'}return}
  if(G.loot){lootBtn(id);return}
  if(G.inv.open){invBtn(id);return}
  if(G.map){if(id==='mapclose'||id==='map')G.map=false;return}
  if(G.menu==='quests'){G.menu=false;return}
  if(G.menu){
    if(id==='resume'||id==='menuclose'||id==='menu')G.menu=false;
    else if(id==='quests'){G.menu='quests'}
    else if(id==='mute'){G.mute=!G.mute}
    else if(id==='crt'){G.crt=!G.crt;try{localStorage.setItem('abbeyCRT',G.crt?'1':'0')}catch(e){}fit()}
    else if(id==='savemenu'){openSaves('menu')}
    else if(id==='overview'){G.menu=false;G.overview=true}
    else if(id==='newparty'){backupAuto();G.menu=false;crInit();G.state='create'}
    else if(id==='restart'){backupAuto();reset();G.state='play';audioInit();msg('You wake in the crypts below the abbey. Something is scratching in the dark...')}
    return;
  }
  if(id==='menu'){G.menu=true;return}
  if(id==='map'){G.map=true;return}
  if(id.startsWith('hero')){openInv(+id.slice(4));return}
  act(id);
  if(['fwd','back','left','right','turnL','turnR'].includes(id))G.hold={id,t:G.time+.42};
}
function toDesign(e){const r=cv.getBoundingClientRect();return [(e.clientX-r.left)/r.width*DW,(e.clientY-r.top)/r.height*DH]}
let PTR=null;
function topBtn(x,y){for(let i=BTNS.length-1;i>=0;i--){const b=BTNS[i];if(x>=b.x&&x<b.x+b.w&&y>=b.y&&y<b.y+b.h)return b}return null}
// a torch or floor item under the finger and within reach, so it can be dragged into a slot
function peekHit(x,y){
  if(G.state!=='play'||G.menu||G.map||G.inv.open||G.loot)return null;
  for(const h of G.hits.slice().sort((a,b)=>a.ty-b.ty)){
    if(h.type==='item'){if(x>=h.x0&&x<=h.x1&&y>=h.y0&&y<=h.y1&&h.ty<=1.9)return h}
    else if(h.type==='torch'){if(Math.hypot(x-h.sx,y-h.sy)<=h.r&&h.ty<=2.8)return h}
  }
  return null;
}
function dropOk(d,id){
  if(!id)return false;
  if(d.kind==='world')return id.startsWith('hero')||id==='swapoff'||id==='swapalt'||id==='special';
  if(d.kind==='inv')return d.src==='bag'?(id.startsWith('islot_')||id.startsWith('ihero')):(id.startsWith('ibag')||id.startsWith('islot_'));
  if(d.kind==='loot')return d.src==='bag'?id.startsWith('lbox'):id.startsWith('lbag');
  return false;
}
function dropItem(d,id){
  if(!id||!d)return;
  if(d.kind==='world'){
    const h=d.h;let hi=G.sel,slot=null;
    if(id.startsWith('hero'))hi=+id.slice(4);else if(id==='special')slot='main';else if(id==='swapoff')slot='off';else if(id==='swapalt')slot='alt';
    if(h.type==='torch'){if(h.L.taken)return;takeTorch(h.L)}else{if(h.ref.taken)return;if(!pickup(h.ref))return}
    const key=h.type==='torch'?'torch':h.ref.k,idx=G.bag.findIndex(b=>b.id===key);
    if(idx<0)return;
    const dfn=ITEMDEF[key];
    if(dfn.k==='potion'||dfn.k==='food'||dfn.k==='quest'||(dfn.k==='spell'&&!HERO_DEF[hi].caster))return;
    const sl=slot||autoSlot(hi,dfn);
    if(sl&&G.heroes[hi].alive&&(id.startsWith('hero')||slotFits(sl,dfn,hi)))equipTo(hi,sl,idx);
    return;
  }
  if(d.kind==='inv'){
    const I=G.inv,hi=I.hero,h=G.heroes[hi];
    if(d.src==='bag'){
      let tgt=hi,slot=null;
      if(id.startsWith('islot_'))slot=id.slice(6);else if(id.startsWith('ihero')){tgt=+id.slice(5);slot=autoSlot(tgt,idef(d.item))}else return;
      if(slot&&equipTo(tgt,slot,d.i))I.sel=tgt===hi?{src:'slot',slot}:null;
    }else if(id.startsWith('ibag')){if(unequip(hi,d.slot))I.sel=null}
    else if(id.startsWith('islot_')){
      const to=id.slice(6);if(to===d.slot)return;
      const a=h.eq[d.slot],b=h.eq[to];if(!a)return;
      if(!slotFits(to,idef(a),hi)||(b&&!slotFits(d.slot,idef(b),hi))){msg('That does not fit there.','#d09a80');return}
      const rf=reqFail(h,idef(a));if(rf){msg(`${HERO_DEF[hi].name} needs ${rf}.`,'#d09a80');return}
      h.eq[to]=a;if(b)h.eq[d.slot]=b;else delete h.eq[d.slot];recalcMax(hi);sfx('equip');I.sel={src:'slot',slot:to};
    }
    return;
  }
  if(d.kind==='loot'){
    const L=G.loot,box=L.decor.contents;
    if(d.src==='bag'&&id.startsWith('lbox')){
      L.sel={side:'bag',i:d.i};
      if(L.shop)lootBtn('lact');else{const it=bagTake(d.i);box.push({id:it.id,n:it.n});sfx('equip');L.sel=null}
    }else if(d.src==='box'&&id.startsWith('lbag')){L.sel={side:'box',i:d.i};lootBtn('lact')}
  }
}
function drawDragGhost(){
  const d=G.drag;if(!d)return;
  const def=d.kind==='world'?(d.h.type==='torch'?ITEMDEF.torch:ITEMDEF[d.h.ref.k]):idef(d.item);
  if(d.hover){ctx.strokeStyle='#ffe36a';ctx.lineWidth=2;rrect(ctx,d.hover.x-1,d.hover.y-1,d.hover.w+2,d.hover.h+2,4);ctx.stroke()}
  ctx.globalAlpha=.92;if(def)itemIcon(def,d.x,d.y,1.5);ctx.globalAlpha=1;
}
cv.addEventListener('pointerdown',e=>{
  e.preventDefault();audioInit();
  const [x,y]=toDesign(e),b=topBtn(x,y);
  if(b){if(b.up){PTR={b,x,y,sc:getScroll(b.drag),moved:false,mode:null}}else handleBtn(b.id);return}
  if(x<420&&y<210&&G.state==='play'){const h=peekHit(x,y);if(h)PTR={b:{id:'world'},world:h,x,y,moved:false,mode:null};else viewTap(x,y)}
});
cv.addEventListener('pointermove',e=>{
  const [x,y]=toDesign(e);
  if(G.drag){G.drag.x=x;G.drag.y=y;const hb=topBtn(x,y);G.drag.hover=hb&&dropOk(G.drag,hb.id)?hb:null}
  if(!PTR)return;
  const dx=x-PTR.x,dy=y-PTR.y;
  if(!PTR.moved&&Math.hypot(dx,dy)>7){
    PTR.moved=true;
    const di=PTR.world?{kind:'world',h:PTR.world}:PTR.b.di;
    if(di&&(PTR.world||!PTR.b.drag||Math.abs(dx)>Math.abs(dy)*.8)){PTR.mode='item';G.drag=Object.assign({},di,{x,y,hover:null})}
    else PTR.mode='scroll';
  }
  if(PTR.moved&&PTR.mode==='scroll'&&PTR.b.drag)setScroll(PTR.b.drag,PTR.sc-dy);
});
function ptrEnd(){
  G.hold=null;const p=PTR;PTR=null;
  if(G.drag){const d=G.drag;G.drag=null;const b=topBtn(d.x,d.y);dropItem(d,b?b.id:null);return}
  if(p){
    if(p.world){if(!p.moved)viewTap(p.x,p.y);return}
    if(!p.moved&&!/area$/.test(p.b.id))handleBtn(p.b.id);
  }
}
addEventListener('pointerup',ptrEnd);
addEventListener('pointercancel',()=>{G.hold=null;PTR=null;G.drag=null});
cv.addEventListener('wheel',e=>{
  if(G.loot){const r=cv.getBoundingClientRect(),x=(e.clientX-r.left)/r.width*DW,d=x<156?'lbag':'lbox';setScroll(d,getScroll(d)+e.deltaY*.5);e.preventDefault();return}
  if(G.inv.open){G.inv.scroll=clamp(G.inv.scroll+e.deltaY*.5,0,maxScroll());e.preventDefault()}
},{passive:false});
cv.addEventListener('contextmenu',e=>e.preventDefault());
const KEYMAP={ArrowUp:'fwd',w:'fwd',W:'fwd',ArrowDown:'back',s:'back',S:'back',ArrowLeft:'turnL',a:'turnL',A:'turnL',ArrowRight:'turnR',d:'turnR',D:'turnR',q:'left',Q:'left',e:'right',E:'right',' ':'attack',Enter:'attack',x:'special',X:'special',p:'potion',P:'potion',z:'wait',Z:'wait',r:'rest',R:'rest'};
addEventListener('keydown',e=>{
  if(e.ctrlKey||e.metaKey||e.altKey)return;
  audioInit();
  if(G.cut){if(e.key==='Enter'||e.key===' '||e.key==='Escape')cutAdvance();e.preventDefault();return}
  if(G.talk){if(e.key==='Escape')G.talk=null;else if(e.key==='Enter'||e.key===' ')talkBtn('tkskip');else if(e.key>='1'&&e.key<='4')talkBtn('tk'+(+e.key-1));e.preventDefault();return}
  if(G.saves){if(e.key==='Escape')G.saves=null;e.preventDefault();return}
  if(G.state==='title'){titleBtn(hasSave('auto')||hasSave('prev')?'tcont':'tnew');e.preventDefault();return}
  if(G.state==='create'){if(e.key==='Enter'){crBtn(G.cr.step==='done'?'cr_start':'cr_ok');e.preventDefault()}return}
  if(G.state==='win'||G.state==='dead'){if(e.key==='Enter'||e.key===' '){reset();G.state='play'}return}
  if(e.key==='Escape'){if(G.overview){G.overview=false}else if(G.loot){G.loot=null}else if(G.inv.open){G.inv.open=false}else{G.menu=!G.menu;G.map=false}e.preventDefault();return}
  if(e.key==='i'||e.key==='I'){if(G.inv.open)G.inv.open=false;else openInv(G.sel);e.preventDefault();return}
  if((e.key==='o'||e.key==='O')&&G.state==='play'){G.overview=!G.overview;return}
  if((e.key==='j'||e.key==='J')&&G.state==='play'){G.menu=G.menu==='quests'?false:'quests';G.map=false;return}
  if(e.key==='m'||e.key==='M'){G.map=!G.map;G.menu=false;return}
  if(G.menu||G.map||G.inv.open||G.loot)return;
  if(e.key>='1'&&e.key<='4'){const i=+e.key-1;if(G.heroes[i].alive)G.sel=i;return}
  const id=KEYMAP[e.key];if(id){e.preventDefault();act(id)}
});
function fit(){
  const s=Math.min(innerWidth/DW,innerHeight/DH),w=Math.floor(DW*s),h=Math.floor(DH*s);
  cv.style.width=w+'px';cv.style.height=h+'px';cv.style.left=Math.floor((innerWidth-w)/2)+'px';cv.style.top=Math.floor((innerHeight-h)/2)+'px';
  const gl=document.getElementById('glass');gl.style.width=cv.style.width;gl.style.height=cv.style.height;gl.style.left=cv.style.left;gl.style.top=cv.style.top;gl.style.display=G.crt?'block':'none';
}
addEventListener('resize',fit);fit();

/* ---------- boot ---------- */
(async function boot(){
  buildTextures();
  makeProps();makeItemSprites();makeCart();makeForestProps();
  IMG._fbRat=fallbackRat(false);IMG._fbBoss=fallbackRat(true);
  for(let i=0;i<4;i++)IMG['_pf'+i]=heroFallback(i);
  try{await Promise.race([Promise.all([document.fonts.load("16px 'IM Fell English SC'"),document.fonts.load("16px 'IM Fell English'"),document.fonts.load("16px 'UnifrakturCook'")]),new Promise(r=>setTimeout(r,2500))])}catch(e){}
  await Promise.all([loadImg('rat','assets/rat.png'),loadImg('boss','assets/boss.png'),loadImg('wolf','assets/wolf.png'),loadImg('bandit','assets/bandit.png'),loadImg('archer','assets/archer.png'),loadImg('bat','assets/bat.png'),loadImg('skel','assets/skel.png'),...['peasantM','peasantW','beggar','drunk','thug','pickpocket','merchant','mayor','goat','shepherdess','huntress','innkeeper','gandrick'].map(n=>loadImg(n,'assets/'+n+'.png')),...Array.from({length:NPORT},(_,i)=>loadImg('pt'+i,'assets/pt/'+i+'.png'))]);
  reset();buildUIPatterns();crtInit();makeAtmos();try{G.crt=localStorage.getItem('abbeyCRT')!=='0'}catch(e){G.crt=true}fit();
  addEventListener('pagehide',()=>{if(G.state==='play'&&G.timers.length===0)writeSave('auto')});
  document.addEventListener('visibilitychange',()=>{if(document.hidden&&G.state==='play'&&G.timers.length===0)writeSave('auto')});
  window.__ready=true;
  requestAnimationFrame(frame);
})();
</script>
