<!doctype html><meta charset="utf-8"><title>Impact options</title>
<style>body{background:#14100c;color:#e0d4b0;font-family:Georgia,serif;margin:0;padding:18px}h1{font-size:20px;margin:0 0 4px}h2{font-size:15px;margin:22px 0 8px;color:#d8c88e}
.row{display:flex;flex-wrap:wrap;gap:10px}button{background:#2a2016;color:#f0e4b4;border:1px solid #8a7448;border-radius:6px;padding:10px 14px;font:14px Georgia;cursor:pointer}button:hover{background:#3c2e1c}
.card{background:#1e1812;border:1px solid #5a4a2c;border-radius:8px;padding:10px;text-align:center}canvas{display:block;margin:0 auto 6px;background:#3a3228;border-radius:4px}small{color:#a89878}</style>
<h1>Impact options</h1><small>All made in the browser, no downloads. Click to hear; the splats show a hit of 23 and a critical 58.</small>
<h2>Hit sounds (thwack)</h2><div class="row" id="hits"></div>
<h2>Miss sounds</h2><div class="row" id="miss"></div>
<h2>Hit splats</h2><div class="row" id="splats"></div>
<script>
let A;const ac=()=>A||(A=new (window.AudioContext||window.webkitAudioContext)());
function noise(c,d){const b=c.createBuffer(1,c.sampleRate*d,c.sampleRate),a=b.getChannelData(0);for(let i=0;i<a.length;i++)a[i]=Math.random()*2-1;return b}
function env(c,g,t,a,d,v){g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+a);g.gain.exponentialRampToValueAtTime(.001,t+a+d)}
function thump(c,t,f0,f1,d,v){const o=c.createOscillator(),g=c.createGain();o.type='sine';o.frequency.setValueAtTime(f0,t);o.frequency.exponentialRampToValueAtTime(f1,t+d);env(c,g,t,.002,d,v);o.connect(g).connect(c.destination);o.start(t);o.stop(t+d+.05)}
function nz(c,t,d,type,f,q,v,sweep){const s=c.createBufferSource();s.buffer=noise(c,d+.1);const fl=c.createBiquadFilter();fl.type=type;fl.frequency.setValueAtTime(f,t);if(sweep)fl.frequency.exponentialRampToValueAtTime(sweep,t+d);fl.Q.value=q;const g=c.createGain();env(c,g,t,.002,d,v);s.connect(fl).connect(g).connect(c.destination);s.start(t);s.stop(t+d+.1)}
const HITS=[
 ['Meaty thwack',c=>{const t=c.currentTime;thump(c,t,170,48,.16,.9);nz(c,t,.07,'lowpass',2400,.7,.55,500);thump(c,t+.012,420,110,.07,.25)}],
 ['Leather slap',c=>{const t=c.currentTime;nz(c,t,.09,'bandpass',1500,1.2,.8,600);thump(c,t,210,70,.1,.6);nz(c,t+.015,.04,'highpass',4000,.5,.25)}],
 ['Wooden crack',c=>{const t=c.currentTime;thump(c,t,320,90,.09,.7);nz(c,t,.05,'bandpass',3200,3,.7,1200);thump(c,t+.03,140,60,.14,.5)}],
 ['Heavy crunch',c=>{const t=c.currentTime;thump(c,t,120,34,.28,1);nz(c,t,.18,'lowpass',1800,1,.7,260);for(let i=0;i<3;i++)nz(c,t+.02+i*.025,.04,'bandpass',900+i*500,2,.35,400)}],
 ['Punchy boom',c=>{const t=c.currentTime;thump(c,t,95,38,.22,1.1);thump(c,t,260,90,.06,.4);nz(c,t,.05,'lowpass',3000,.5,.5,800)}],
 ['Wet smack',c=>{const t=c.currentTime;nz(c,t,.06,'bandpass',900,2.5,.8,350);thump(c,t,150,55,.12,.7);nz(c,t+.045,.07,'lowpass',700,1,.4,200)}]];
const MISS=[
 ['Soft whoosh',c=>{const t=c.currentTime;nz(c,t,.22,'bandpass',400,1.4,.35,2600)}],
 ['Quick swish',c=>{const t=c.currentTime;nz(c,t,.12,'highpass',1200,.8,.3,5200)}],
 ['Dull thud on air',c=>{const t=c.currentTime;nz(c,t,.18,'bandpass',600,1,.3,1800);thump(c,t+.12,90,60,.08,.12)}]];
function mk(list,id){const el=document.getElementById(id);list.forEach(([n,f])=>{const b=document.createElement('button');b.textContent=n;b.onclick=()=>f(ac());el.appendChild(b)})}
mk(HITS,'hits');mk(MISS,'miss');
/* splats */
function blob(x,cx,cy,r,rough,seed){let s=seed;const rnd=()=>(s=(s*16807)%2147483647)/2147483647;const pts=28;x.beginPath();for(let i=0;i<=pts;i++){const a=i/pts*Math.PI*2,rr=r*(1+(rnd()-.5)*rough);const px=cx+Math.cos(a)*rr,py=cy+Math.sin(a)*rr;i?x.lineTo(px,py):x.moveTo(px,py)}x.closePath()}
let x_c=0,y_c=0;
function txtN(x,cx,cy,n,size,fill,stroke,lw){x.font=`bold ${size}px Georgia`;x.textAlign='center';x.textBaseline='middle';x.lineJoin='round';x.lineWidth=lw;x.strokeStyle=stroke;x.strokeText(n,cx,cy);x.fillStyle=fill;x.fillText(n,cx,cy)}
const SPL=[
 ['Ink splat',(x,n,crit)=>{const R=crit?44:34;x_c=70;y_c=70;const g=x.createRadialGradient(70,66,4,70,70,R+10);g.addColorStop(0,'#e83a2a');g.addColorStop(1,'#8a1410');x.fillStyle=g;blob(x,70,70,R,.55,7);x.fill();x.lineWidth=2.5;x.strokeStyle='#3a0806';x.stroke();
   let s=11;const rnd=()=>(s=(s*16807)%2147483647)/2147483647;for(let i=0;i<9;i++){const a=rnd()*6.28,d=R+6+rnd()*14;x.beginPath();x.arc(70+Math.cos(a)*d,70+Math.sin(a)*d,2+rnd()*4,0,6.29);x.fillStyle='#b01c14';x.fill();x.stroke()}
   x.fillStyle='rgba(255,255,255,.28)';x.beginPath();x.ellipse(56,52,11,6,-.5,0,6.29);x.fill();txtN(x,70,72,n,crit?30:24,'#fff4e8','#3a0806',5)}],
 ['Comic burst',(x,n,crit)=>{const R=crit?52:40;x.beginPath();for(let i=0;i<20;i++){const a=i/20*6.2832,r=i%2?R*.62:R;x.lineTo(70+Math.cos(a)*r,70+Math.sin(a)*r)}x.closePath();x.fillStyle='#d41c1c';x.fill();x.lineWidth=5;x.strokeStyle='#fff';x.lineJoin='round';x.stroke();x.lineWidth=2;x.strokeStyle='#3a0606';x.stroke();
   txtN(x,70,72,n,crit?32:26,'#ffe9a0','#3a0606',5)}],
 ['Smear',(x,n,crit)=>{x.save();x.translate(70,70);x.rotate(-.18);const L=crit?60:48;let s=5;const rnd=()=>(s=(s*16807)%2147483647)/2147483647;x.beginPath();for(let i=0;i<=24;i++){const t=i/24,px=-L+t*2*L,py=-16-Math.sin(t*3.14)*14-rnd()*5;i?x.lineTo(px,py):x.moveTo(px,py)}for(let i=24;i>=0;i--){const t=i/24,px=-L+t*2*L,py=16+Math.sin(t*3.14)*14+rnd()*5;x.lineTo(px,py)}x.closePath();const g=x.createLinearGradient(-L,0,L,0);g.addColorStop(0,'#7a0c0c');g.addColorStop(.5,'#d82418');g.addColorStop(1,'#8a1010');x.fillStyle=g;x.fill();x.lineWidth=2.5;x.strokeStyle='#2a0404';x.stroke();x.restore();
   txtN(x,70,70,n,crit?30:24,'#fff','#2a0404',5)}],
 ['Wound badge',(x,n,crit)=>{const R=crit?36:28;x.beginPath();x.arc(70,70,R+6,0,6.29);x.fillStyle='#5a0c0a';x.fill();const g=x.createRadialGradient(64,62,3,70,70,R+4);g.addColorStop(0,'#ff6a50');g.addColorStop(1,'#a81810');x.beginPath();x.arc(70,70,R,0,6.29);x.fillStyle=g;x.fill();x.lineWidth=3;x.strokeStyle='#ffd8c0';x.stroke();
   for(let i=0;i<8;i++){const a=i/8*6.28+.2;x.beginPath();x.moveTo(70+Math.cos(a)*(R+6),70+Math.sin(a)*(R+6));x.lineTo(70+Math.cos(a)*(R+16+(i%3)*5),70+Math.sin(a)*(R+16+(i%3)*5));x.lineWidth=4;x.strokeStyle='#b01c14';x.lineCap='round';x.stroke()}
   txtN(x,70,72,n,crit?28:22,'#fff','#4a0808',4)}]];
const sp=document.getElementById('splats');
SPL.forEach(([name,f])=>{for(const [n,crit] of [['23',0],['58',1]]){const d=document.createElement('div');d.className='card';const c=document.createElement('canvas');c.width=140;c.height=140;f(c.getContext('2d'),n,crit);d.appendChild(c);d.appendChild(document.createTextNode(name+(crit?' (critical)':'')));sp.appendChild(d)}});
</script>
